{% load static %}<!doctype html>
<html lang="pt-BR" data-area="{% block area %}membros{% endblock %}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{% block theme_color %}#141414{% endblock %}">
<title>{% block title %}Emergensimples · Área de membros{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/gomut/tokens.css' %}">
<link rel="stylesheet" href="{% static 'css/gomut/base.css' %}">
<link rel="stylesheet" href="{% static 'css/gomut/components.css' %}">
<link rel="stylesheet" href="{% static 'css/gomut/members.css' %}">{% block extra_css %}{% endblock %}<script src="{% static 'js/gomut/navigation.js' %}" defer>
</script>
</head>
<body>{% block body %}{% endblock %}<div class="toasts" id="toasts" role="status" aria-live="polite">
</div>{% block extra_js %}{% endblock %}</body>
</html>
