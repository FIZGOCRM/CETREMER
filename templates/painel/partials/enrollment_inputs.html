<label>Curso<select required name="course_id" data-plan-months><option value="">Escolha um curso</option>{% for course in choices %}<option value="{{ course.pk }}" data-months="{{ course.plan_months }}"{% if creation_form.course_id.value|stringformat:'s' == course.pk|stringformat:'s' %} selected{% endif %}>{{ course.title }}</option>{% endfor %}</select>{{ creation_form.course_id.errors }}</label><div class="gp-grid-2"><label>Início do plano<input type="date" required name="starts_on" value="{% if creation_form %}{{ creation_form.starts_on.value|default:'' }}{% else %}{{ today|date:'Y-m-d' }}{% endif %}">{{ creation_form.starts_on.errors }}</label><label>Último dia com acesso<input type="date" name="last_day" value="{{ creation_form.last_day.value|default:'' }}">{{ creation_form.last_day.errors }}</label></div>
