<h2 class="section-title">Anotações</h2><p class="muted">Sempre privadas. Elas ficam salvas no minuto atual do vídeo.</p><form method="post" action="{% url 'lesson_notes' lesson.pk %}" data-note-form class="lesson-note-form">{% csrf_token %}<input type="hidden" name="position_seconds" value="0" data-note-position><label for="note-text">Escreva uma anotação</label><textarea id="note-text" name="text" required placeholder="Escreva uma anotação. Ela fica salva no minuto atual do vídeo."></textarea><button class="btn btn--outline" type="submit">Salvar em <span data-note-at>0:00</span></button></form><p role="alert" data-note-error hidden></p><div data-note-list>{% for note in notes %}<article class="lesson-note" data-note-id="{{ note.pk }}"><button type="button" data-seek="{{ note.position_seconds }}" class="btn btn--outline btn--sm"><span data-format-time="{{ note.position_seconds }}">{{ note.position_seconds }} s</span></button><p>{{ note.text }}</p><form method="post" action="{% url 'delete_lesson_note' lesson.pk note.pk %}" data-delete-note>{% csrf_token %}<button class="btn btn--outline btn--sm">Apagar</button></form></article>{% empty %}<p class="muted" data-empty-notes>Nenhuma anotação nesta aula ainda.</p>{% endfor %}</div>
<template id="note-template"><article class="lesson-note"><button type="button" class="btn btn--outline btn--sm" data-seek></button><p></p><form method="post" data-delete-note>{% csrf_token %}<button class="btn btn--outline btn--sm">Apagar</button></form></article></template>
