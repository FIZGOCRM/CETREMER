/* ---------- CERTIFICADOS ---------- */
function certCode(c){ return `ES-2026-${C[c].code}-${(S.initials+c.length*7919).replace(/\D/g,'').slice(0,2)}${S.initials}${C[c].certHours}`; }
function validCPF(v){ const d=v.replace(/\D/g,''); if(d.length!==11||/^(\d)\1+$/.test(d)) return false; let s=0; for(let i=0;i<9;i++) s+=+d[i]*(10-i); let r=(s*10)%11; if(r===10) r=0; if(r!==+d[9]) return false; s=0; for(let i=0;i<10;i++) s+=+d[i]*(11-i); r=(s*10)%11; if(r===10) r=0; return r===+d[10]; }
function certBlock(c, compact){
  const st=status(c), k=C[c];
  const checks=[[nDone(c)===nTotal(c),`Assistir todas as ${nTotal(c)} aulas`,`${nDone(c)}/${nTotal(c)}`],[S.quiz[c]>=70,'Avaliação final com 70% ou mais',S.quiz[c]!=null?S.quiz[c]+'%':'pendente'],[!!S.cpf,'Nome completo e CPF cadastrados',S.cpf?'ok':'pendente']];
  let action='';
  if(S.issued[c]) action=`<button class="btn btn-white btn-sm" data-a="viewcert" data-c="${c}">${I.award} Ver certificado</button>`;
  else if(certReady(c) && !S.cpf) action = S.certOpen===c ? `<form class="form" id="cpfForm" data-c="${c}" novalidate><label class="field full">Nome completo (como vai no certificado)<input id="cf-name" value="${esc(S.fullName)}"></label><label class="field">CPF<input id="cf-cpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14">${S.certErr?`<span class="err">${S.certErr}</span>`:''}</label><div class="field" style="justify-content:flex-end"><button type="button" class="link" data-a="fillcpf" style="font-size:12.5px;margin-bottom:12px">Preencher CPF de exemplo</button></div><div class="full" style="display:flex;gap:8px"><button class="btn btn-red btn-sm" type="submit">Salvar e emitir</button><button type="button" class="btn btn-line btn-sm" data-a="certclose">Cancelar</button></div></form>` : `<button class="btn btn-white btn-sm" data-a="certopen" data-c="${c}">${I.award} Completar dados e emitir</button>`;
  else if(certReady(c)) action=`<button class="btn btn-white btn-sm" data-a="issue" data-c="${c}">${I.award} Emitir certificado</button>`;
  else action=`<div style="display:flex;gap:8px;flex-wrap:wrap">${cta(c,'btn-sm')}</div>`;
  return `<div class="cert-card" ${compact?'style="max-width:640px"':''}><div class="ch">${art(c)}<div style="min-width:0"><div style="margin-bottom:4px">${S.issued[c]?'<span class="pill p-done"><i></i>Emitido</span>':certReady(c)?'<span class="pill p-exam"><i></i>Pronto para emitir</span>':'<span class="pill p-new"><i></i>Bloqueado</span>'}</div><h3>${k.title}</h3><small class="dim">Carga horária ${k.certHours}h</small></div></div>
    <div class="checks">${checks.map(x=>`<div class="${x[0]?'ok':''}"><span class="cb">${x[0]?I.check:''}</span><span style="flex:1">${x[1]}</span><span class="dim num" style="font-size:12.5px">${x[2]}</span></div>`).join('')}</div>${action}</div>`;
}
function paper(c){ const k=C[c]; return `<div class="paper"><svg class="wm" viewBox="0 0 320 180"><path d="${ecgPath}" fill="none" stroke="#e5222c" stroke-width="3"/></svg>
  <div><div class="pt">Certificado de conclusão</div><div class="pc" style="margin-top:3cqw">Certificamos que</div><div class="pn">${esc(S.fullName)}</div><div class="pc">concluiu o curso <b>${k.title}</b>, com carga horária de <b>${k.certHours} horas</b>, assistindo a todas as ${nTotal(c)} aulas e obtendo <b>${S.quiz[c]}%</b> de aproveitamento na avaliação final.</div></div>
  <div class="pf"><div><div style="margin-bottom:1cqw">${logo('ink')}</div><div>Emitido em 16/11/2026</div><div>Código ${certCode(c)}</div></div><div class="sig">Coordenação do curso</div></div></div>`; }
function viewCerts(){
  if(S.certView){ const c=S.certView; return `<div class="wrap" style="padding-bottom:40px"><div class="phead"><button class="back" data-a="certback">${I.left} Certificados</button><h1>Seu certificado</h1></div>
    <div class="cert-view" style="margin-top:18px">${paper(c)}<div class="panel" style="display:flex;flex-direction:column;gap:12px"><h3>${C[c].title}</h3><p class="muted" style="font-size:14px">Qualquer pessoa pode validar este certificado pelo código abaixo.</p><div class="verify"><span class="num">${certCode(c)}</span><button class="link" data-a="copycode" data-c="${c}">${I.copy}</button></div>
    <button class="btn btn-white" data-a="toast" data-m="PDF do certificado gerado para download">${I.down} Baixar PDF</button><button class="btn btn-line" data-a="toast" data-m="Abre o LinkedIn com o certificado preenchido">Adicionar ao LinkedIn</button></div></div></div>`; }
  return `<div class="wrap" style="padding-bottom:40px"><div class="phead"><span class="eyebrow">Requisitos e emissão</span><h1>Certificados</h1><p class="muted">Cada curso libera um certificado ao concluir as aulas e passar na avaliação final.</p></div>
    <div class="certs" style="margin-top:18px">${S.courses.map(c=>certBlock(c)).join('')}</div></div>`;

  const y=window.scrollY;
  if(MODE==='portal'){ app.innerHTML = viewPortal() + presHTML(); window.scrollTo(0,y); return; }
  if(MODE==='gm'){ app.innerHTML = renderGM() + presHTML(); window.scrollTo(0,y); return; }
  if(S.base){ const pub=S.base.filter(c=>!G.courses[c] || (G.order.includes(c) && G.courses[c].status==='Publicado')); S.courses = pub.length? pub : [...S.base]; }
  if(S.view!=='lesson') S.lqs=null;
  app.innerHTML = (S.lqs?'':'') + (UI.fromGM && S.view!=='login' ? `<div class="asmember">Vendo como membro · ${esc(S.name)}<button data-a="backGM">Voltar ao painel do produtor</button></div>` : '') + (S.view==='login'? viewLogin() : header()+`<main id="view">${VIEWS[S.view]()}</main>`+tabbar()) + (S.search?searchHTML():'') + (S.view==='lesson'?quizModal():'') + presHTML();

}
function go(v,extra){ if(S.view==='lesson') leaveLesson(); S.notif=S.menu=S.search=false; S.view=v; S.certView=null; Object.assign(S,extra||{}); render(); window.scrollTo(0,0); }
function onScroll(){ const t=document.getElementById('top'); if(t) t.classList.toggle('solid', window.scrollY>40 || !['home','course'].includes(S.view)); }
window.addEventListener('scroll',onScroll,{passive:true});

/* ---------- ações ---------- */
const act = {
  go:d=>{ go(d.v); if(d.cert && d.v==='certs' && S.issued[d.cert]){ S.certView=d.cert; render(); } },
  mycourses:()=>{ go('home'); setTimeout(()=>{ const el=document.getElementById('meus-cursos'); if(el) window.scrollTo({top:el.offsetTop-70,behavior:'smooth'}); },30); },
  course:d=>go('course',{course:d.c,ctab:'aulas'}),
  lesson:d=>{ if(S.view==='lesson') leaveLesson(); S.notif=S.menu=S.search=false; clearInterval(P.cdTimer); P.c=d.c; P.l=d.l; P.ended=false; P.t=(S.resume[d.c]&&S.resume[d.c].l===d.l)?S.resume[d.c].t:0; S.view='lesson'; S.ltab='sobre'; render(); window.scrollTo(0,0); },
  play:()=>{ if(P.playing){ stopPlayer(); } else { const l=findL(P.l); if(P.t>=l.dur*60){ P.t=0; P.ended=false; render(); } P.playing=true; P.timer=setInterval(tick,100); } updVideo(); },
  seek:(d,el,e)=>{ const r=el.getBoundingClientRect(); const l=findL(P.l); P.t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*l.dur*60; updVideo(); if(P.t>=l.dur*60*.9 && !isDone(P.c,l.id)){ if(!P.playing){ P.playing=true; P.timer=setInterval(tick,100);} } },
  vclick:(d,el,e)=>{ if(e.target.closest('.vctrl,.vnext')) return; act.play(); },
  seekto:d=>{ P.t=+d.t; updVideo(); window.scrollTo({top:0,behavior:'smooth'}); },
  cancelnext:()=>{ clearInterval(P.cdTimer); P.ended=false; render(); },
  toggledone:()=>{ const c=P.c,id=P.l; if(isDone(c,id)){ S.done[c]=S.done[c].filter(x=>x!==id); toast('Marcação removida'); } else { markDone(c,id,false); } render(); },
  ltab:d=>{ S.ltab=d.t; render(); },
  lqStart:d=>{ stopPlayer(); updVideo(); S.lqs={l:d.l,i:0,ans:{},phase:d.skip?'q':'intro',enter:true}; render(); },
  lqBegin:()=>{ S.lqs.phase='q'; S.lqs.i=0; S.lqs.enter=true; render(); },
  lqAns:d=>{ const st=S.lqs; if(st.ans[st.i]!=null) return; st.ans[st.i]=+d.o; st.enter=false; render(); },
  lqNext:()=>{ const st=S.lqs; const qs=quizOf(st.l); if(st.ans[st.i]==null) return; st.i++; st.enter=true;
    if(st.i>=qs.length){ st.phase='done'; const ok=qs.filter((q,i)=>st.ans[i]===q.a).length; const prev=S.lq[st.l]; S.lq[st.l]={best:Math.max(ok,prev?prev.best:0),n:qs.length}; S.lqLast=S.lqLast||{}; S.lqLast[st.l]={...st.ans}; log(`Quiz de “${findL(st.l).title}”: ${ok}/${qs.length}`); }
    render(); },
  lqClose:(d,el,e)=>{ if(d.bg && e.target!==el) return; const st=S.lqs; if(st && st.phase==='q' && Object.keys(st.ans).length) toast('Quiz fechado. Você pode recomeçar quando quiser.',false); S.lqs=null; S.ltab='quiz'; render(); },
  lqNextLesson:d=>{ S.lqs=null; act.lesson({c:d.c,l:d.l}); },
  lqFinal:d=>{ S.lqs=null; act.quiz({c:d.c}); },
  lqAsk:d=>{ S.lqs=null; act.newTopic({c:d.c,l:d.l}); },
  lqGo:d=>{ const l=findL(d.l); if(S.view!=='lesson'||P.l!==d.l){ act.lesson({c:l.c,l:d.l}); } P.ended=false; clearInterval(P.cdTimer); act.lqStart({l:d.l}); },
  ctab:d=>{ S.ctab=d.t; render(); },
  mod:d=>{ S.open[d.k]= S.open[d.k]===false; render(); },

  quiz:d=>{ if(S.view==='lesson') leaveLesson(); S.quizState={c:d.c,answers:{},submitted:false}; go('quiz'); },
  submitquiz:()=>{ const q=S.quizState, k=C[q.c]; const right=k.quiz.filter((x,i)=>q.answers[i]===x.a).length; const pc=Math.round(right/k.quiz.length*100); q.submitted=true; S.quiz[q.c]=Math.max(S.quiz[q.c]||0,pc); log(`Nota ${pc}% na avaliação final de ${k.title}`); render(); window.scrollTo({top:0,behavior:'smooth'}); },
  retry:()=>{ S.quizState={c:S.quizState.c,answers:{},submitted:false}; render(); window.scrollTo(0,0); },
  certopen:d=>{ S.certOpen=d.c; S.certErr=''; render(); setTimeout(()=>{ const i=document.getElementById('cf-cpf'); if(i) i.focus(); },20); },
  certclose:()=>{ S.certOpen=null; render(); },

  issue:d=>{ S.issued[d.c]=true; log(`Emitiu o certificado de ${C[d.c].title}`); S.certView=d.c; toast('Certificado emitido'); render(); window.scrollTo(0,0); },
  viewcert:d=>{ if(S.view!=='certs') go('certs'); S.certView=d.c; render(); window.scrollTo(0,0); },
  certback:()=>{ S.certView=null; render(); },
  copycode:d=>{ const code=certCode(d.c); navigator.clipboard?.writeText(code).then(()=>toast('Código copiado')).catch(()=>toast('Código: '+code)); },
  liverem:d=>{ S.liveRem[d.i]=!S.liveRem[d.i]; if(S.liveRem[d.i]) toast('Lembrete ativo: avisamos 1 hora antes'); render(); },
  remind:()=>{ S.remind=!S.remind; render(); },

  menu:()=>{ S.menu=!S.menu; S.notif=false; render(); },

  closesearch:(d,el,e)=>{ if(e.target.closest('[data-stop]')) return; S.search=false; render(); },
  toast:d=>toast(d.m),
  forgot:()=>{ document.getElementById('forgotMsg').innerHTML=`<div class="hint">Enviamos um link de redefinição para <b>${S.email}</b>.</div>`; },
  logout:()=>{ go('login'); },
  hero:d=>{ UI.heroIdx=+d.i; document.getElementById('hero').innerHTML=heroHTML(); },
  pres:()=>{ UI.pres=!UI.pres; render(); },
  student:d=>{ const v=S.view==='login'?'login':'home'; loadStudent(d.k, v); render(); window.scrollTo(0,0); toast('Vendo como '+STUDENTS[d.k].name); },
  jump:d=>{
    const v=d.v; const main=S.courses[0]; const c = S.courses.includes('cardio')?'cardio':main;
    if(v==='login') return go('login');
    if(v==='home') return go('home');
    if(v==='progressSec'){ go('home'); setTimeout(()=>{ const b=document.querySelector('.band'); if(b) window.scrollTo({top:b.offsetTop-60,behavior:'smooth'}); },30); return; }
    if(v==='coursePage') return act.course({c});
    if(v==='lessonPage'){ const n=nextLesson(c)||lessonsOf(c)[0]; return act.lesson({c,l:n.id}); }
    if(v==='quizPage') return act.quiz({c});
    go(v);
  }
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(MODE==='gm' && G.menu && !e.target.closest('.g-menu,[data-a=gMenu]')){ G.menu=false; if(!el){ render(); return; } }
  if(!el){ if((S.notif||S.menu) && !e.target.closest('.pop')){ S.notif=S.menu=false; render(); } return; }
  const fn=act[el.dataset.a]; if(!fn) return;
  if(el.tagName!=='LABEL' && !e.target.closest('label,input,select,textarea')) e.preventDefault();
  if((S.notif||S.menu) && !['notif','menu','readall'].includes(el.dataset.a) && !el.closest('.pop')){ S.notif=S.menu=false; }
  fn(el.dataset,el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && MODE==='gm' && (G.modal||G.menu||G.drawer)){ G.modal=null; G.menu=false; G.drawer=false; render(); return; }
  if(e.key==='Escape' && MODE==='aluno' && S.lqs){ S.lqs=null; render(); return; }
  if(e.key==='Escape' && MODE==='aluno' && S.ebOpen){ S.ebOpen=null; render(); return; }
  if(e.key==='Escape'){ if(S.search||S.notif||S.menu||UI.pres){ S.search=S.notif=S.menu=false; UI.pres=false; render(); } }
  if(e.key==='Enter' && e.target.matches('[role=button][data-a]')) e.target.click();
  if(e.key===' ' && MODE==='aluno' && S.view==='lesson' && !S.lqs && !e.target.matches('input,textarea,button')){ e.preventDefault(); act.play(); }
});
document.addEventListener('change',e=>{
  if(e.target.matches('input[data-q]')){ S.quizState.answers[+e.target.dataset.q]=+e.target.dataset.o; const n=Object.keys(S.quizState.answers).length, t=C[S.quizState.c].quiz.length; document.getElementById('qcount').textContent=`${n} de ${t} respondidas`; document.getElementById('qsub').disabled=n<t; }
});
document.addEventListener('input',e=>{
  if(e.target.id==='sq'){ S.q=e.target.value; const tmp=document.createElement('div'); tmp.innerHTML=searchHTML(); document.getElementById('sres').innerHTML=tmp.querySelector('#sres').innerHTML; }
  if(e.target.id==='cf-cpf'){ let d=e.target.value.replace(/\D/g,'').slice(0,11); e.target.value=d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
});
document.addEventListener('submit',e=>{
  e.preventDefault(); if(MODE!=='aluno') return;
  if(e.target.id==='loginForm'){ go('home'); toast(`Bem-vindo(a), ${S.first}`); }
  if(e.target.id==='cpfForm'){ const name=document.getElementById('cf-name').value.trim(), cpf=document.getElementById('cf-cpf').value;
    if(name.split(/\s+/).length<2){ S.certErr='Informe nome e sobrenome.'; render(); return; }
    if(!validCPF(cpf)){ S.fullName=name; S.certErr='CPF inválido. Confira os 11 dígitos.'; render(); return; }
    S.fullName=name; S.cpf=cpf; S.certErr=''; S.certOpen=null; act.issue({c:e.target.dataset.c}); }
});

  c1:[['Qual é o primeiro passo ao receber um paciente grave no pronto-socorro?',['Pedir exames laboratoriais','Garantir a segurança e checar a responsividade','Colher a história completa','Prescrever analgesia'],1,'Segurança e responsividade vêm antes de tudo. Depois vem a avaliação sistematizada.'],

  const tp = e.type==='Mentoria'? gPill('Mentoria','dark') : gPill(e.type,'out');
  return `<div class="g-live"><div class="ld"><b>${e.d}</b><small>NOV</small></div><div style="min-width:0"><div style="display:flex;gap:6px;flex-wrap:wrap">${tp}${gPill(e.f,'grey')}</div><strong>${gEsc(e.t)}</strong><div class="lm">${e.dow} · ${e.dur} min${edit?' · sala cadastrada':''}</div></div>
  <div style="display:flex;gap:8px">${edit?`<button class="gbtn" data-a="gModal" data-m="encontro" data-i="${i}">${GI.pencil} Editar</button><button class="gbtn gbtn-sq" data-a="gDelLive" data-i="${i}" aria-label="Excluir">${GI.trash}</button>`:`<button class="gbtn" data-a="gTab" data-t="vivo">Abrir</button>`}</div></div>`;
}
function gVivo(){
  return `<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap"><div><h2 style="font-size:24px;font-weight:600;margin:0">Agenda</h2><p style="font-size:15px;color:var(--g-ink2);margin:6px 0 0">Encontros da mentoria, plantões de dúvidas e aulas abertas. O aluno vê a agenda e pode ativar o lembrete.</p></div><button class="gbtn gbtn-p gbtn-lg" data-a="gModal" data-m="encontro">${GI.plus} Novo encontro</button></div>${G.live.map((e,i)=>gLiveRow(e,i,true)).join('')||'<p class="g-sub">Nenhum encontro na agenda.</p>'}`;
}

/* ---------- conteúdo ---------- */
function gConteudo(c){
  const t=[['aulas','Aulas e módulos'],['trilhas','Trilhas'],['vendas','Cursos à venda'],['inicio','Página inicial'],['areas','Áreas']];
  let b='';
  if(G.ctab==='aulas') b=gModules(c);
  if(G.ctab==='trilhas') b=gTrilhas();
  if(G.ctab==='vendas') b=gVendas();
  if(G.ctab==='inicio') b=gInicio();
  if(G.ctab==='areas') b=gAreas();
  return `<div class="gtabs sm" style="margin-bottom:24px">${t.map(([k,l])=>`<button class="${G.ctab===k?'on':''}" data-a="gCtab" data-t="${k}">${l}</button>`).join('')}</div>${b}`;
}
function gModules(c){
  const k=C[c];
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap"><p style="font-size:16px;color:var(--g-ink2);margin:0;max-width:60ch">Tudo o que o aluno assiste em ${gEsc(k.title)}. Cada módulo tem aulas, e as alterações aparecem na área do aluno.</p><button class="gbtn" data-a="gAsMember" data-v="course" data-c="${c}">${GI.play} Visualizar como membro</button></div>
  ${k.modules.map((m,mi)=>{ const open=G.open[c+mi]!==false; const mins=m.lessons.reduce((a,l)=>a+l.dur,0);
    return `<div class="g-mod ${open?'open':''}"><button class="g-mod-h" data-a="gModOpen" data-k="${c+mi}"><span class="g-mod-n">${mi+1}</span><span><span class="mt">MÓDULO ${mi+1}</span><strong>${gEsc(m.title)}</strong><span class="mm">${m.lessons.length} aulas · ${mins} min</span><div style="margin-top:8px">${gPill('Liberado')}</div></span><span class="chev">${GI.down.replace('<svg','<svg width="22" height="22"')}</span></button>
    ${open?`<div class="g-mod-act"><button class="gbtn" data-a="gModal" data-m="modulo" data-i="${mi}">${GI.pencil} Editar módulo</button><button class="gbtn" data-a="gModal" data-m="excluirModulo" data-i="${mi}">${GI.trash} Excluir</button></div>
    ${m.lessons.map((l,li)=>{ const x=lmOf(l.id); return `<div class="g-les"><span class="ln">${li+1}</span><div style="min-width:0"><strong>${gEsc(l.title)}</strong><div class="lp">${gPill(x.status==='Publicada'?'Publicada':'Rascunho',x.status==='Publicada'?'ok':'grey')}${x.vimeo?gPill('▸ Vídeo do Vimeo','out'):gPill('▸ Sem link do Vimeo','out')}${x.ebook?gPill('E-book','out'):''}${quizOf(l.id).length?gPill('Quiz','out'):''}</div></div><span class="ld">${l.dur} min</span><span class="la"><button class="gbtn gbtn-sq" data-a="gMoveL" data-m="${mi}" data-i="${li}" data-d="-1" ${li===0?'disabled':''} aria-label="Subir">${GI.up}</button><button class="gbtn gbtn-sq" data-a="gMoveL" data-m="${mi}" data-i="${li}" data-d="1" ${li===m.lessons.length-1?'disabled':''} aria-label="Descer">${GI.down}</button><button class="gbtn" data-a="gLesson" data-l="${l.id}">${GI.pencil} Editar</button></span></div>`; }).join('')}
    <div class="g-newrow"><input id="nl-${mi}" placeholder="Nome da nova aula"><button class="gbtn gbtn-p gbtn-lg" data-a="gNewLesson" data-m="${mi}">${GI.plus} Criar aula</button></div>`:''}</div>`; }).join('')}
  <div class="g-newmod"><input id="nm" placeholder="Título do novo módulo"><button class="gbtn gbtn-dark gbtn-lg" data-a="gNewModule">${GI.plus} Criar módulo</button></div>`;
}
function gTrilhas(){
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap"><p style="font-size:16px;color:var(--g-ink2);margin:0">Trilhas são sequências de módulos que o aluno segue em ordem.</p><button class="gbtn gbtn-p gbtn-lg" data-a="gModal" data-m="trilha" data-i="-1">${GI.plus} Nova trilha</button></div>
  ${G.trilhas.map((t,i)=>`<div class="g-row"><span class="rn">${i+1}</span><div style="min-width:0"><strong>${gEsc(t.t)}</strong><div class="rd">${gEsc(t.d)}</div><div class="rs">${t.items.length} módulos: ${t.items.map(gEsc).join(', ')}</div></div><div class="ra"><button class="gbtn" data-a="gModal" data-m="trilha" data-i="${i}">${GI.pencil} Editar</button><button class="gbtn gbtn-sq" data-a="gDel" data-k="trilhas" data-i="${i}" aria-label="Excluir">${GI.trash}</button></div></div>`).join('')}`;
}
function gVendas(){
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap"><p style="font-size:16px;color:var(--g-ink2);margin:0;max-width:60ch">Cursos vendidos à parte. Aparecem bloqueados na vitrine do Início e levam à página do curso, com o botão de checkout.</p><button class="gbtn gbtn-p gbtn-lg" data-a="gModal" data-m="venda" data-i="-1">${GI.plus} Novo curso à venda</button></div>
  ${G.vendas.map((v,i)=>`<div class="g-sale">${art(v.hue)}<div style="min-width:0"><strong>${gEsc(v.t)}</strong><div class="sm">${gEsc(v.a)} · R$ ${v.p},00 · até ${v.n}x · 7 aulas</div>${v.link?gPill('Checkout configurado','ok'):gPill('Sem link de checkout','warn')}</div><div class="sa">Na vitrine <button class="gtoggle ${v.vit?'on':''}" data-a="gVit" data-i="${i}" aria-label="Na vitrine"></button><button class="gbtn" data-a="toast" data-m="Abre os módulos e aulas do curso à venda">${GI.play} Aulas e módulos</button><button class="gbtn" data-a="gModal" data-m="venda" data-i="${i}">${GI.pencil} Editar</button></div></div>`).join('')}`;
}
function gInicio(){
  return `<p style="font-size:16px;color:var(--g-ink2);margin:0 0 20px">O que aparece na página inicial do aluno.</p><div style="max-width:860px;display:flex;flex-direction:column;gap:14px">
  <div class="gcard"><h3>Destaque</h3><div class="glist-row" style="margin-top:12px"><div><div class="gl-t">Frase de boas-vindas</div><div class="gl-s">É a descrição do curso. Aparece embaixo do título, no hero do Início.</div></div><div class="gl-r"><button class="gbtn" data-a="gTab" data-t="basico">Alterar</button></div></div><div class="glist-row"><div><div class="gl-t">Título do destaque</div><div class="gl-s">É o título de cada curso do aluno. Cada curso do plano vira um slide do hero.</div></div><div class="gl-r"><button class="gbtn" data-a="gTab" data-t="basico">Alterar</button></div></div><div class="glist-row"><div><div class="gl-t">Turma</div><div class="gl-s">Mostra sempre o ano atual e muda sozinha na virada do ano.</div></div><div class="gl-r">${gPill('Turma 2026','out')}</div></div></div>
  <div class="gcard gform"><h3>Vitrine de cursos à venda</h3><label class="gfield">Título<input value="Outros cursos da Emergensimples"></label><label class="gfield">Texto de apoio<input value="Escolha um para ver o conteúdo e comprar."></label></div>
  <div class="gcard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3>Fileiras do Início</h3><p class="gc-sub">Mude a ordem com as setas e desligue as que não quer mostrar</p></div><button class="gbtn" data-a="toast" data-m="Abre a criação de uma fileira por área">${GI.plus} Nova fileira</button></div>
  <div style="margin-top:8px">${G.fileiras.map((f,i)=>`<div class="glist-row"><div><div class="gl-t">${f.t}</div><div class="gl-s">${f.d}</div></div><div class="gl-r"><button class="gbtn gbtn-sq" data-a="gMove" data-k="fileiras" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Subir">${GI.up}</button><button class="gbtn gbtn-sq" data-a="gMove" data-k="fileiras" data-i="${i}" data-d="1" ${i===G.fileiras.length-1?'disabled':''} aria-label="Descer">${GI.down}</button><button class="gtoggle ${f.on?'on':''}" data-a="gFil" data-i="${i}" aria-label="Mostrar fileira"></button></div></div>`).join('')}</div></div>
  <button class="gbtn gbtn-p gbtn-lg" style="width:100%" data-a="toast" data-m="Página inicial salva">Salvar página inicial</button></div>`;
}
function gAreas(){
  return `<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap"><p style="font-size:16px;color:var(--g-ink2);margin:0;max-width:60ch">As áreas organizam o catálogo do aluno: são os filtros da busca e a base das fileiras do Início.</p><button class="gbtn gbtn-p gbtn-lg" data-a="gModal" data-m="area" data-i="-1">${GI.plus} Nova área</button></div>
  <div class="gcard" style="max-width:860px;padding-block:8px">${G.areas.map((a,i)=>`<div class="glist-row"><div><div class="gl-t">${gEsc(a.n)}</div><div class="gl-s">${a.t}</div></div><div class="gl-r"><button class="gbtn" data-a="gModal" data-m="area" data-i="${i}">${GI.pencil} Renomear</button><button class="gbtn gbtn-sq" data-a="gDel" data-k="areas" data-i="${i}" aria-label="Excluir">${GI.trash}</button></div></div>`).join('')}</div>`;
}

/* ---------- editar aula ---------- */
function gAula(){
  const l=findL(G.lesson); if(!l) return '';
  const c=l.c, x=lmOf(l.id), qz=quizOf(l.id), mods=C[c].modules;
  return `${gCrumb([['Conteúdo','gTab','data-t="conteudo"'],[C[c].title,'gTab','data-t="conteudo"'],[l.mod]])}
  <div class="g-head"><div><h1 class="g-h1">${gEsc(l.title)}</h1><p class="g-sub" style="margin-top:4px">Aula ${x.status==='Publicada'?'publicada':'em rascunho'}.</p></div><button class="gbtn gbtn-lg" data-a="gAsMember" data-v="lesson" data-c="${c}" data-l="${l.id}">${GI.play} Visualizar como membro</button></div>
  <div class="g-lesson"><div>
    <div class="gcard gform"><h3>Conteúdo da aula</h3>
      <label class="gfield">Título<input id="la-t" value="${gEsc(l.title)}"></label>
      <label class="gfield">Descrição<textarea id="la-d" placeholder="Aparece para o aluno em “Sobre a aula”.">${gEsc(x.desc)}</textarea><span class="ghelp">Aparece para o aluno em “Sobre a aula”.</span></label>
      <label class="gfield">Link do vídeo no Vimeo<input id="la-v" placeholder="https://vimeo.com/123456789" value="${gEsc(x.vimeo)}"><span class="ghelp">O vídeo fica hospedado no Vimeo e é incorporado à página da aula: o aluno assiste sem sair da área de membros.</span></label>
      <label class="gfield">Duração, em minutos<input id="la-m" type="number" min="1" value="${l.dur}"><span class="ghelp">Mostrada ao lado do nome da aula.</span></label></div>
    <div class="gcard"><h3>E-book da aula</h3><p class="gc-sub">Um PDF por aula</p><div style="margin-top:16px">${x.ebook?`<div class="g-file"><span class="fi">${GI.book}</span><div style="min-width:0;flex:1"><strong>ebook-${l.id}-${l.title.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,40)}.pdf</strong><small>PDF · o aluno baixa na aba Material da aula</small></div><button class="gbtn" data-a="toast" data-m="No sistema real, abre o seletor de arquivo">Substituir</button><button class="gbtn gbtn-sq" data-a="gEbook" aria-label="Remover e-book">${GI.trash}</button></div>`:`<button class="gbtn" data-a="gEbook">${GI.upl} Enviar PDF</button>`}</div></div>
    <div class="gcard"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div><h3>Quiz da aula</h3><p class="gc-sub">Aparece na aba Quiz</p></div><button class="gbtn" data-a="gQAdd">${GI.plus} Adicionar questão</button></div>
      ${qz.map((q,qi)=>`<div class="g-q"><div class="g-q-h">Questão ${qi+1}<button class="gbtn" data-a="gQDel" data-i="${qi}">${GI.trash} Remover</button></div><textarea data-qf="q" data-i="${qi}" placeholder="Enunciado da questão">${gEsc(q.q)}</textarea>${q.o.map((o,oi)=>`<label class="opt"><input type="radio" name="qa${qi}" data-qa="${qi}" data-o="${oi}" ${q.a===oi?'checked':''} aria-label="Alternativa correta"><input type="text" data-qf="o" data-i="${qi}" data-o="${oi}" value="${gEsc(o)}" placeholder="Alternativa ${oi+1}"></label>`).join('')}<input class="cmt" data-qf="c" data-i="${qi}" value="${gEsc(q.c||'')}" placeholder="Comentário mostrado depois da resposta"></div>`).join('')||'<p class="g-sub" style="font-size:14px">Nenhuma questão. Aula sem questões fica sem a aba Quiz.</p>'}
      <p class="ghelp" style="margin-top:12px;display:block">Em cada questão, marque a alternativa correta. O comentário aparece para o aluno logo depois que ele responde.</p></div>
  </div><div>
    <div class="gcard gform"><h3>Configurações de publicação</h3>
      <label class="gfield">Situação<select id="la-s"><option ${x.status==='Publicada'?'selected':''}>Publicada</option><option ${x.status!=='Publicada'?'selected':''}>Rascunho</option></select></label>
      <div class="gfield">Data de liberação
        <label class="g-radio"><input type="radio" name="rel" value="imediata" ${x.rel==='imediata'?'checked':''}> Imediata</label>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="g-radio"><input type="radio" name="rel" value="data" ${x.rel==='data'?'checked':''}> Em uma data</label><input type="date" id="la-date" value="${x.date}" style="height:40px;width:170px"></div>
        <label class="g-radio"><input type="radio" name="rel" value="dias" ${x.rel==='dias'?'checked':''}> Dias após a entrada do aluno</label><input id="la-days" type="number" value="${x.days}" style="height:40px;width:90px"><span class="ghelp">Se o módulo também tiver data, vale a maior das duas.</span></div>
      <label class="gfield">Módulo<select id="la-mod">${mods.map((m,i)=>`<option value="${i}" ${i===l.mi?'selected':''}>Módulo ${i+1} · ${gEsc(m.title)}</option>`).join('')}</select></label>
      <button class="gbtn gbtn-p gbtn-lg" data-a="gSaveLesson">Salvar aula</button><button class="gbtn gbtn-lg" data-a="gModal" data-m="excluirAula">${GI.trash} Excluir aula</button></div>
    <div class="gcard" style="margin-top:16px"><h3 style="margin-bottom:16px">Prévia do vídeo</h3><div class="g-vprev">${x.vimeo?`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">${GI.play}<span>Vídeo do Vimeo vinculado<br><small style="opacity:.7">${gEsc(x.vimeo)}</small></span></div>`:`<div style="display:flex;flex-direction:column;align-items:center;gap:8px">${GI.play}<span>Cole o link do Vimeo para ver o vídeo aqui.</span></div>`}</div></div>
  </div></div>`;
}

/* ---------- alunos ---------- */
function gAlunos(){
  const q=G.stuQ.trim().toLowerCase();
  const list=G.students.filter(s=>(G.stuFilter==='todos'||(G.stuFilter==='ativos'&&s.status==='ativo')||(G.stuFilter==='cancelados'&&s.status==='cancelado')||(G.stuFilter===s.courses.join('+'))||(G.stuFilter==='ambos'&&s.courses.length===2)) && (!q||s.name.toLowerCase().includes(q)||s.email.includes(q)));
  const act=G.students.filter(s=>s.status==='ativo'), both=act.filter(s=>s.courses.length===2).length;
  const chips=[['todos','Todos'],['ativos','Ativos'],['cancelados','Cancelados'],['ambos','Com os 2 cursos'],['cardio','Só Emergências cardiovasculares'],['plantao','Só Plantão sem GPT']];
  return `<div class="g-head"><div><h1 class="g-h1">Alunos</h1><p class="g-sub">Quem está nos cursos. Só o coprodutor configura ou cancela o plano; o aluno não cancela por conta própria.</p></div><button class="gbtn gbtn-p gbtn-lg" data-a="gModal" data-m="addAluno">${GI.plus} Adicionar aluno</button></div>
  <div class="g-kpis" style="margin-bottom:26px"><div class="g-kpi"><span class="k1">${GI.users} Alunos ativos</span><span class="k2">${act.length}</span><span class="k3">${G.students.length-act.length} cancelado</span></div><div class="g-kpi"><span class="k1">${GI.grid} Com os 2 cursos</span><span class="k2">${both}</span><span class="k3">${Math.round(both/act.length*100)}% da base</span></div><div class="g-kpi"><span class="k1">${GI.play.replace('<svg','<svg style="width:15px;height:15px;color:var(--g-teal)"')} Emergências cardiovasculares</span><span class="k2">${gStudentsOf('cardio').length}</span><span class="k3">alunos com o curso</span></div><div class="g-kpi"><span class="k1">${GI.play.replace('<svg','<svg style="width:15px;height:15px;color:var(--g-teal)"')} Plantão sem GPT</span><span class="k2">${gStudentsOf('plantao').length}</span><span class="k3">alunos com o curso</span></div></div>
  <div class="g-chips" style="margin-bottom:16px">${chips.map(([k,l])=>`<button class="g-chip ${G.stuFilter===k?'on':''}" data-a="gStuF" data-k="${k}">${l}</button>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap"><label class="gsearch">${GI.search}<input id="gsq" placeholder="Buscar por nome ou e-mail" value="${gEsc(G.stuQ)}"></label><span style="font-size:14.5px;color:var(--g-ink2)">${list.length} alunos</span></div>
  <div class="g-table-wrap"><table class="g-table"><thead><tr><th>Aluno</th><th>Cursos</th><th>Acesso até</th><th>Progresso</th><th>Plano</th><th></th></tr></thead><tbody>
  ${list.map(s=>`<tr><td><div class="g-stu"><span class="sa">${s.ini}</span><div><strong>${gEsc(s.name)}</strong><small>${s.email} · último acesso ${s.last}</small></div></div></td><td><div class="g-cc">${s.courses.map(c=>`<span class="${c==='plantao'?'pl':''}">${c==='cardio'?'Emergências cardio.':'Plantão sem GPT'}</span>`).join('')}</div></td><td class="num">${s.access}</td><td><div class="g-prog"><i><b style="width:${s.prog}%"></b></i>${s.prog}%</div></td><td>${s.status==='ativo'?gPill('Ativo'):gPill('Cancelado','grey')}</td><td><div style="display:flex;gap:8px;justify-content:flex-end">${['mariana','rafael','juliana'].includes(s.name.split(' ')[0].toLowerCase())?`<button class="gbtn" data-a="gViewStu" data-k="${s.name.split(' ')[0].toLowerCase()}" title="Ver a área do aluno como ${gEsc(s.name)}">${GI.play} Ver como</button>`:''}<button class="gbtn" data-a="gModal" data-m="plano" data-i="${s.id}">${GI.sliders} Configurar plano</button>${s.status==='ativo'?`<button class="gbtn" data-a="gModal" data-m="cancelar" data-i="${s.id}">Cancelar plano</button>`:`<button class="gbtn" data-a="gReativar" data-i="${s.id}">Reativar</button>`}</div></td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ---------- comunidade ---------- */
function gCom(){
  const vis=G.posts.filter(p=>!p.hidden); const f=G.comF||'todos';
  const list=vis.filter(p=>f==='todos'||(f==='sem'&&!p.m&&!p.solved&&!p.rep.some(r=>r.m))||(f==='res'&&p.solved)||(f===p.course));
  return `<div class="g-head"><div><h1 class="g-h1">Comunidade</h1><p class="g-sub">Os tópicos dos alunos sobre o conteúdo dos cursos. Responda, marque a resposta que resolve a dúvida como solução e oculte o que não for da comunidade. Ao responder, o aluno recebe o aviso “Seu comentário foi respondido”.</p></div></div>
  <div class="g-chips" style="margin-bottom:12px">${[['todos','Todos',vis.length],['sem','Sem resposta da mentoria',gUnans()],['res','Resolvidos',vis.filter(p=>p.solved).length],['cardio','Emergências cardiovasculares'],['plantao','Plantão sem GPT'],['geral','Geral']].map(([k,l,n])=>`<button class="g-chip ${f===k?'on':''}" data-a="gComF" data-k="${k}">${l}${n!=null?` (${n})`:''}</button>`).join('')}</div>
  <p style="font-size:14.5px;color:var(--g-ink2);margin:0 0 18px">${list.length} tópicos${G.posts.length-vis.length?` · ${G.posts.length-vis.length} oculto`:''}</p>
  ${list.map(p=>{ const noAns=!p.m && !p.solved && !p.rep.some(r=>r.m);

    <div class="g-reply"><span class="g-pa"><span class="av m" style="width:32px;height:32px;font-size:12px">HP</span></span><input id="rp-${p.id}" placeholder="Responder como ${gEsc(G.cfg.who)}…"><button class="gbtn gbtn-p" data-a="gReply" data-i="${p.id}">Responder</button></div>
    <div style="margin:12px 0 0 54px;display:flex;gap:8px;flex-wrap:wrap">${p.m?'':`<button class="gbtn" data-a="gSolveT" data-i="${p.id}">${p.solved?'Reabrir tópico':'Marcar como resolvido'}</button>`}<button class="gbtn" data-a="gPin" data-i="${p.id}">${p.pinned?'Desafixar':'Fixar no topo'}</button><button class="gbtn" data-a="gHide" data-i="${p.id}">Ocultar publicação</button></div></div>`; }).join('')||'<p class="g-sub">Nenhum tópico neste filtro.</p>'}`;
}

/* ---------- chamados ---------- */
function gChamados(){
  const ab=G.tickets.filter(t=>t.st!=='resolvido'), rs=G.tickets.filter(t=>t.st==='resolvido'); const list=G.chTab==='abertos'?ab:rs;
  const pill=t=>t.st==='aberto'?gPill('Aberto','warn'):t.st==='analise'?gPill('Em análise','out'):gPill('Resolvido');
  return `<div class="g-head"><div><h1 class="g-h1">Chamados</h1><p class="g-sub">Pedidos técnicos abertos pelos alunos no Suporte. Os chamados ficam visíveis para a turma, sem dados pessoais. A equipe é avisada em ${gEsc(G.cfg.mail)} a cada chamado novo.</p></div></div>
  <div class="gtabs sm"><button class="${G.chTab==='abertos'?'on':''}" data-a="gChTab" data-t="abertos">Em andamento (${ab.length})</button><button class="${G.chTab==='resolvidos'?'on':''}" data-a="gChTab" data-t="resolvidos">Resolvidos (${rs.length})</button></div>
  ${list.map(t=>{ const open=G.chOpen===t.id; return `<div class="g-tk"><button class="g-tk-h" data-a="gTk" data-i="${t.id}"><span class="id">#${t.id}</span><span style="min-width:0"><strong>${gEsc(t.title||t.sub)}</strong><small>${t.sub} · ${gEsc(t.who)} · ${t.when}${t.votes?` · ${t.votes} com o mesmo problema`:''}</small></span><span class="r">${pill(t)}${(open?GI.up:GI.down).replace('<svg','<svg width="20" height="20"')}</span></button>
    ${open?`<div class="g-tk-b"><p style="margin:0;font-size:15px">${gEsc(t.txt)}</p>${t.st!=='resolvido'?`<textarea id="tk-${t.id}" placeholder="Escreva a resposta para o aluno…"></textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><small style="color:var(--g-ink2);font-size:12.5px">O aluno vê a resposta no próprio chamado e recebe o aviso “Seu chamado foi respondido”.</small><div style="display:flex;gap:8px">${t.st==='aberto'?`<button class="gbtn gbtn-lg" data-a="gAnalise" data-i="${t.id}">Marcar em análise</button>`:''}<button class="gbtn gbtn-p gbtn-lg" data-a="gTkAns" data-i="${t.id}">Responder e resolver</button></div></div>`:`<div class="ans"><b>Resposta do suporte:</b> ${gEsc(t.ans)}</div><div><button class="gbtn" data-a="gReopen" data-i="${t.id}">Reabrir chamado</button></div>`}</div>`:''}</div>`; }).join('')||'<p class="g-sub">Nenhum chamado aqui.</p>'}`;
}

/* ---------- relatórios ---------- */
function gRel(){
  const act=G.students.filter(s=>s.status==='ativo');
  const days=Array.from({length:30},(_,i)=>{ const base=14+Math.round(9*Math.sin(i/3.2)+i*.35); return Math.max(4, base + (i%7===5||i%7===6?-6:0)); });
  const max=Math.ceil(Math.max(...days)/10)*10, W=700,H=200,pl=28,pb=24,bw=(W-pl)/30;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alunos que acessaram por dia, últimos 30 dias">${[0,max/2,max].map(v=>{const y=H-pb-(v/max)*(H-pb-10);return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#e3e8e6"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`;}).join('')}${days.map((v,i)=>{const h=(v/max)*(H-pb-10);return `<rect x="${pl+i*bw+bw*.18}" y="${H-pb-h}" width="${bw*.64}" height="${h}" rx="2" fill="${i===29?'#08736a':'#9cc7bd'}"/>`;}).join('')}${[0,7,14,21,29].map(i=>{ const dt=new Date(2026,10,16-(29-i)); return `<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${i===29?'hoje':dt.getDate()+'/'+(dt.getMonth()+1)}</text>`; }).join('')}</svg>`;
  const avg=c=>{ const s=gStudentsOf(c); return s.length? Math.round(s.reduce((a,x)=>a+x.prog,0)/s.length) : 0; };
  const top=[['Dor torácica: abordagem inicial','cardio',31],['ECG na emergência','cardio',28],['Sepse: a primeira hora','plantao',26],['Passagem de plantão com SBAR','plantao',24],['IAM com supra de ST','cardio',19],['Prescrição segura','plantao',17]];
  const risk=act.filter(s=>/semana|5 dias|4 dias/.test(s.last)).slice(0,5);
  return `<div class="g-head"><div><h1 class="g-h1">Relatórios</h1><p class="g-sub">Como os alunos estão usando os cursos. Números dos últimos 30 dias.</p></div><button class="gbtn gbtn-lg" data-a="toast" data-m="Relatório exportado em planilha">${GI.file} Exportar planilha</button></div>
  <div class="g-kpis"><div class="g-kpi"><span class="k1">${GI.users} Alunos ativos</span><span class="k2">${act.length}</span><span class="k3">+4 neste mês</span></div><div class="g-kpi"><span class="k1">${GI.chart} Acessaram nos últimos 7 dias</span><span class="k2">${Math.round(act.length*.78)}</span><span class="k3">${Math.round(.78*100)}% dos ativos</span></div><div class="g-kpi"><span class="k1">${GI.play.replace('<svg','<svg style="width:15px;height:15px;color:var(--g-teal)"')} Horas assistidas</span><span class="k2">412</span><span class="k3">média de 11h por aluno</span></div><div class="g-kpi"><span class="k1">${GI.award} Certificados emitidos</span><span class="k2">3</span><span class="k3">2 prontos para emitir</span></div></div>
  <div class="g-2col" style="margin-top:0"><div class="gcard"><h3>Alunos que acessaram por dia</h3><p class="gc-sub" style="margin-bottom:14px">Últimos 30 dias</p><div class="g-bars">${svg}</div></div>
  <div class="gcard"><h3>Progresso médio por curso</h3><p class="gc-sub" style="margin-bottom:10px">Entre os alunos com o curso</p>${G.order.map(c=>`<div class="g-hbar"><span style="text-align:left;color:var(--g-ink)">${gEsc(C[c].title)}</span><i><b style="width:${avg(c)}%"></b></i><span>${avg(c)}%</span></div>`).join('')}
    <h3 style="margin-top:22px">Avaliação final</h3><p class="gc-sub" style="margin-bottom:10px">Aprovados com 70% ou mais</p><div class="g-hbar"><span style="text-align:left;color:var(--g-ink)">Emergências cardiovasculares</span><i><b style="width:83%"></b></i><span>83%</span></div><div class="g-hbar"><span style="text-align:left;color:var(--g-ink)">Plantão sem GPT</span><i><b style="width:76%"></b></i><span>76%</span></div></div></div>
  <div class="g-2col"><div class="gcard"><h3>Aulas mais assistidas</h3><p class="gc-sub" style="margin-bottom:10px">Alunos que concluíram a aula</p>${top.map(t=>`<div class="g-hbar"><span style="text-align:left;color:var(--g-ink)">${t[0]}<br><small style="color:var(--g-mute)">${C[t[1]].title}</small></span><i><b style="width:${t[2]/36*100}%"></b></i><span>${t[2]}</span></div>`).join('')}</div>
  <div class="gcard"><h3>Alunos sem acesso recente</h3><p class="gc-sub" style="margin-bottom:6px">Vale um lembrete ou uma mensagem</p>${risk.map(s=>`<div class="glist-row" style="padding:12px 0"><div class="g-stu"><span class="sa">${s.ini}</span><div><strong>${gEsc(s.name)}</strong><small>último acesso ${s.last} · ${s.prog}% concluído</small></div></div><div class="gl-r"><button class="gbtn" data-a="toast" data-m="Lembrete enviado para ${gEsc(s.name)}">Enviar lembrete</button></div></div>`).join('')}</div></div>`;
}

  if(G.cfgTab==='avisos'){ const a=G.avisos; const row=(k,t,d,ex)=>`<div class="glist-row"><div><div class="gl-t">${t}</div><div class="gl-s">${d}</div>${ex?`<div class="gl-s" style="font-size:12.5px">Exemplo: “${ex}”</div>`:''}</div><div class="gl-r"><button class="gtoggle ${a[k]?'on':''}" data-a="gAviso" data-k="${k}" aria-label="${t}"></button></div></div>`;

/* ---------- modais ---------- */
function gModalHTML(){
  const m=G.modal; if(!m) return '';
  let h='', title='', foot='';
  const close=`<button class="x" data-a="gClose" aria-label="Fechar">${GI.x}</button>`;
  const cancelBtn=`<button class="gbtn gbtn-lg" data-a="gClose">Cancelar</button>`;
  if(m.t==='excluirCurso'){ title='Excluir curso'; h=`<p>O curso “${gEsc(C[G.course].title)}” sai da sua lista de cursos e da área de membros, com todas as aulas. Esta ação não pode ser desfeita.</p>`; foot=`${cancelBtn}<button class="gbtn gbtn-danger gbtn-lg" data-a="gDelCourse">Excluir curso</button>`; }
  if(m.t==='excluirModulo'){ const mo=C[G.course].modules[m.i]; title='Excluir módulo'; h=`<p>O módulo “${gEsc(mo.title)}” e as ${mo.lessons.length} aulas dele saem da área de membros. Esta ação não pode ser desfeita.</p>`; foot=`${cancelBtn}<button class="gbtn gbtn-danger gbtn-lg" data-a="gDelModule" data-i="${m.i}">Excluir módulo</button>`; }
  if(m.t==='excluirAula'){ const l=findL(G.lesson); title='Excluir aula'; h=`<p>A aula “${gEsc(l.title)}” sai do módulo e da área de membros. O progresso dos alunos nela é perdido. Esta ação não pode ser desfeita.</p>`; foot=`${cancelBtn}<button class="gbtn gbtn-danger gbtn-lg" data-a="gDelLesson">Excluir aula</button>`; }
  if(m.t==='modulo'){ const mo=C[G.course].modules[m.i]; title='Editar módulo'; h=`<div class="gform"><label class="gfield">Título do módulo<input id="md-t" value="${gEsc(mo.title)}"></label><div class="gfield">Liberação<label class="g-radio"><input type="radio" name="mrel" checked> Liberado para todos</label><label class="g-radio"><input type="radio" name="mrel"> Em uma data</label></div></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSaveModule" data-i="${m.i}">Salvar</button>`; }
  if(m.t==='trilha'){ const tr=m.i>=0?G.trilhas[m.i]:{t:'',d:'',items:[]}; m.items=m.items||[...tr.items]; const all=[...new Set(G.order.flatMap(c=>C[c].modules.map(x=>x.title)))];
    title=m.i>=0?'Editar trilha':'Nova trilha'; h=`<div class="gform"><label class="gfield">Título da trilha<input id="tr-t" value="${gEsc(tr.t)}"></label><label class="gfield">Descrição<textarea id="tr-d">${gEsc(tr.d)}</textarea><span class="ghelp">Aparece no cartão e no topo da página da trilha.</span></label>
      <div class="gfield">Módulos da trilha<div>${m.items.map((it,i)=>`<div class="g-ord"><span>${i+1}. ${gEsc(it)}</span><button class="gbtn gbtn-sq" data-a="gTrMove" data-i="${i}" data-d="-1" ${i===0?'disabled':''} aria-label="Subir">${GI.up}</button><button class="gbtn gbtn-sq" data-a="gTrMove" data-i="${i}" data-d="1" ${i===m.items.length-1?'disabled':''} aria-label="Descer">${GI.down}</button><button class="gbtn gbtn-sq" data-a="gTrDel" data-i="${i}" aria-label="Remover">${GI.x}</button></div>`).join('')}</div>
      <select id="tr-add" data-a2="trAdd"><option value="">Adicionar módulo…</option>${all.filter(x=>!m.items.includes(x)).map(x=>`<option>${gEsc(x)}</option>`).join('')}</select><span class="ghelp">O aluno segue os módulos nesta ordem. Use as setas para mudar a posição.</span></div></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSaveTrilha">Salvar</button>`; }
  if(m.t==='venda'){ const v=m.i>=0?G.vendas[m.i]:{t:'',a:'Emergência',d:'',learn:'',p:'',n:12,g:7,link:''}; title=m.i>=0?'Editar curso à venda':'Novo curso à venda';
    h=`<div class="gform"><label class="gfield">Título do curso<input id="v-t" value="${gEsc(v.t)}"></label><label class="gfield">Área<select id="v-a">${G.areas.map(a=>`<option ${a.n===v.a?'selected':''}>${gEsc(a.n)}</option>`).join('')}</select></label><label class="gfield">Descrição<textarea id="v-d">${gEsc(v.d)}</textarea><span class="ghelp">Aparece no topo da página do curso.</span></label><label class="gfield">O que você vai aprender<textarea id="v-l">${gEsc(v.learn)}</textarea><span class="ghelp">Um item por linha. Aparece na página do curso, antes do conteúdo.</span></label>
    <div class="grow3"><label class="gfield">Preço (R$)<input id="v-p" type="number" value="${v.p}"></label><label class="gfield">Parcelas<input id="v-n" type="number" value="${v.n}"></label><label class="gfield">Garantia (dias)<input id="v-g" type="number" value="${v.g}"></label></div>
    <label class="gfield">Link do checkout<input id="v-k" placeholder="https://" value="${gEsc(v.link)}"><span class="ghelp">Os botões “Comprar” e “Ir para o checkout” abrem este endereço.</span></label></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSaveVenda">Salvar</button>`; }
  if(m.t==='encontro'){ const e=m.i!=null&&m.i>=0?G.live[m.i]:null; title=e?'Editar encontro':'Novo encontro';
    h=`<div class="gform"><label class="gfield">Título<input id="e-t" value="${e?gEsc(e.t):''}"></label><label class="gfield">Tipo<select id="e-ty">${['Mentoria','Aberto a todos','Aula ao vivo'].map(o=>`<option ${e&&e.type===o?'selected':''}>${o==='Mentoria'?'Encontro da mentoria':o}</option>`).join('')}</select></label>
    <div class="grow3"><label class="gfield">Data<input id="e-d" type="date" value="2026-11-${e?String(e.d).padStart(2,'0'):'28'}"></label><label class="gfield">Hora<input id="e-h" type="time" value="20:00"></label><label class="gfield">Duração (min)<input id="e-du" type="number" value="${e?e.dur:60}"></label></div>
    <label class="gfield">Descrição<textarea id="e-ds"></textarea><span class="ghelp">Aparece no destaque da página Ao vivo.</span></label><label class="gfield">Link da sala<input placeholder="https://"><span class="ghelp">O botão “Entrar na sala” abre este endereço. Para o aluno, a sala abre 10 minutos antes do início.</span></label><label class="gfield">Link da gravação no Vimeo<input placeholder="https://vimeo.com/123456789"><span class="ghelp">Depois do encontro. A gravação entra em “Novos conteúdos”.</span></label></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSaveLive">${e?'Salvar':'Criar encontro'}</button>`; }
  if(m.t==='plano'){ const s=G.students.find(x=>x.id==m.i); title='Plano de '+s.name;
    h=`<div class="gform"><label class="gfield">Situação do plano<select id="p-s"><option ${s.status==='ativo'?'selected':''}>Ativo</option><option ${s.status!=='ativo'?'selected':''}>Cancelado</option></select></label>
    <div class="gfield">Cursos do plano<label class="g-radio"><input type="checkbox" id="p-c1" ${s.courses.includes('cardio')?'checked':''} style="accent-color:var(--g-teal);width:18px;height:18px"> Emergências cardiovasculares</label><label class="g-radio"><input type="checkbox" id="p-c2" ${s.courses.includes('plantao')?'checked':''} style="accent-color:var(--g-teal);width:18px;height:18px"> Plantão sem GPT</label></div>
    <label class="gfield">Acesso até<input id="p-a" value="${s.access}"><span class="ghelp">O acesso dura ${G.cfg.dur} a partir da entrada (${s.entry}).</span></label><label class="gfield">Observação interna<textarea id="p-n">${gEsc(s.note)}</textarea><span class="ghelp">Só a equipe vê.</span></label></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSavePlano" data-i="${s.id}">Salvar</button>`; }
  if(m.t==='cancelar'){ const s=G.students.find(x=>x.id==m.i); title='Cancelar plano'; h=`<p>${gEsc(s.name)} perde o acesso aos cursos agora. O progresso fica guardado e volta se o plano for reativado.</p>`; foot=`<button class="gbtn gbtn-lg" data-a="gClose">Manter plano</button><button class="gbtn gbtn-danger gbtn-lg" data-a="gCancelPlano" data-i="${s.id}">Cancelar plano</button>`; }
  if(m.t==='addAluno'){ title='Adicionar aluno'; h=`<div class="gform"><label class="gfield">Nome completo<input id="aa-n"></label><label class="gfield">E-mail<input id="aa-e" type="email"><span class="ghelp">O aluno recebe neste e-mail o link para criar a senha.</span></label><div class="gfield">Cursos do plano<label class="g-radio"><input type="checkbox" id="aa-c1" checked style="accent-color:var(--g-teal);width:18px;height:18px"> Emergências cardiovasculares</label><label class="g-radio"><input type="checkbox" id="aa-c2" style="accent-color:var(--g-teal);width:18px;height:18px"> Plantão sem GPT</label></div></div>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gAddAluno">Adicionar aluno</button>`; }
  if(m.t==='area'){ const a=m.i>=0?G.areas[m.i]:{n:''}; title=m.i>=0?'Renomear área':'Nova área'; h=`<label class="gfield">Nome da área<input id="ar-n" value="${gEsc(a.n)}"></label>`; foot=`${cancelBtn}<button class="gbtn gbtn-p gbtn-lg" data-a="gSaveArea">Salvar</button>`; }
  const small=['excluirCurso','excluirModulo','excluirAula','cancelar','area'].includes(m.t);
  return `<div class="g-modal-bg" data-a="gBg"><div class="g-modal" role="dialog" aria-modal="true" aria-label="${title}" style="${small?'width:min(640px,100%)':''}">${close}<h2>${title}</h2>${h}<div class="g-modal-f">${foot}</div></div></div>`;
}

/* ---------- render ---------- */
function renderGM(){
  if(G.view==='login') return `<div class="gm">${gLogin()}</div>`;
  const V={cursos:gCursos,criar:gCriar,curso:gCurso,aula:gAula,rel:gRel,com:gCom,alunos:gAlunos,certs:gCerts,acesso:gAcesso,chamados:gChamados,cfg:gCfg};
  return `<div class="gm">${gHeader()}<div class="g-shell">${gSide()}<main class="g-main"><div class="g-wrap">${V[G.view]()}${gFoot()}</div></main></div>${gModalHTML()}</div>`;
}
function gGo(v,extra){ Object.assign(G,{view:v,menu:false,drawer:false,modal:null},extra||{}); render(); window.scrollTo(0,0); }
function gFind(id){ for(const c in C){ for(const [mi,m] of C[c].modules.entries()){ const li=m.lessons.findIndex(l=>l.id===id); if(li>=0) return {c,mi,li,m}; } } }

Object.assign(act,{
  toPortal:()=>{ if(S.view==='lesson') leaveLesson(); MODE='portal'; UI.fromGM=false; G.menu=false; render(); window.scrollTo(0,0); },
  pickAluno:()=>{ MODE='aluno'; UI.fromGM=false; loadStudent(S?S.key:'mariana','login'); render(); window.scrollTo(0,0); },
  pickGM:()=>{ MODE='gm'; G.view='login'; render(); window.scrollTo(0,0); },
  gLogout:()=>gGo('login'),
  gGo:d=>gGo(d.v),
  gDrawer:()=>{ G.drawer=!G.drawer; render(); },
  gMenu:()=>{ G.menu=!G.menu; render(); },
  gCourse:d=>gGo('curso',{course:d.c,tab:'visao',ctab:'aulas'}),
  gTab:d=>gGo('curso',{tab:d.t}),
  gCtab:d=>gGo('curso',{tab:'conteudo',ctab:d.t}),
  gCfg:d=>gGo('cfg',{cfgTab:d.t}),
  gLesson:d=>gGo('aula',{lesson:d.l}),
  gModOpen:d=>{ G.open[d.k]= G.open[d.k]===false; render(); },
  gAsMember:d=>{ MODE='aluno'; UI.fromGM=true; if(!S || S.view==='login') loadStudent('mariana','home'); G.menu=false;
    if(d.v==='course' && S.courses.includes(d.c)) { S.view='course'; S.course=d.c; S.ctab='aulas'; }
    else if(d.v==='lesson'){ if(!S.courses.includes(d.c)) loadStudent('juliana','home'); render(); act.lesson({c:d.c,l:d.l}); return; }
    else S.view='home';
    render(); window.scrollTo(0,0); },
  backGM:()=>{ if(S.view==='lesson') leaveLesson(); MODE='gm'; UI.fromGM=false; render(); window.scrollTo(0,0); },
  gViewStu:d=>{ loadStudent(d.k,'home'); MODE='aluno'; UI.fromGM=true; render(); window.scrollTo(0,0); toast('Vendo como '+STUDENTS[d.k].name); },
  gPublish:()=>{ const m=G.courses[G.course]; m.status=m.status==='Publicado'?'Rascunho':'Publicado'; toast(m.status==='Publicado'?'Curso publicado na área de membros':'Curso despublicado: os alunos não veem mais'); render(); },
  gModal:d=>{ G.modal={t:d.m,i:d.i!=null?+d.i:undefined}; G.menu=false; render(); setTimeout(()=>{ const i=document.querySelector('.g-modal input:not([type=radio]):not([type=checkbox]),.g-modal select'); if(i&&!['excluirCurso','excluirModulo','excluirAula','cancelar'].includes(d.m)) i.focus(); },20); },
  gClose:()=>{ G.modal=null; render(); },
  gBg:(d,el,e)=>{ if(e.target===el){ G.modal=null; render(); } },
  gDelCourse:()=>{ const c=G.course; G.order=G.order.filter(x=>x!==c); G.modal=null; toast('Curso excluído'); gGo('cursos'); },
  gSaveModule:d=>{ const v=document.getElementById('md-t').value.trim(); if(!v) return toast('Dê um título ao módulo',false); C[G.course].modules[d.i].title=v; G.modal=null; toast('Módulo salvo'); render(); },
  gDelModule:d=>{ C[G.course].modules.splice(+d.i,1); G.modal=null; toast('Módulo excluído'); render(); },
  gNewModule:()=>{ const i=document.getElementById('nm'); const v=i.value.trim(); if(!v) return toast('Escreva o título do módulo',false); C[G.course].modules.push({title:v,lessons:[]}); toast('Módulo criado. Agora adicione as aulas.'); render(); },
  gNewLesson:d=>{ const i=document.getElementById('nl-'+d.m); const v=i.value.trim(); if(!v) return toast('Escreva o nome da aula',false); const id='n'+Date.now().toString(36); C[G.course].modules[d.m].lessons.push({id,title:v,dur:10}); lmOf(id).status='Rascunho'; lmOf(id).ebook=false; toast('Aula criada como rascunho'); gGo('aula',{lesson:id}); },
  gMoveL:d=>{ const L=C[G.course].modules[d.m].lessons, i=+d.i, j=i+(+d.d); [L[i],L[j]]=[L[j],L[i]]; render(); },
  gMove:d=>{ const L=G[d.k], i=+d.i, j=i+(+d.d); [L[i],L[j]]=[L[j],L[i]]; render(); },
  gDel:d=>{ G[d.k].splice(+d.i,1); toast('Removido'); render(); },
  gSaveLesson:()=>{ const f=gFind(G.lesson); if(!f) return; const l=f.m.lessons[f.li], x=lmOf(l.id);
    const t=document.getElementById('la-t').value.trim(); if(!t) return toast('A aula precisa de um título',false);
    l.title=t; l.dur=Math.max(1,+document.getElementById('la-m').value||l.dur); x.desc=document.getElementById('la-d').value; x.vimeo=document.getElementById('la-v').value.trim(); x.status=document.getElementById('la-s').value;
    x.rel=(document.querySelector('input[name=rel]:checked')||{}).value||'imediata'; x.date=document.getElementById('la-date').value; x.days=+document.getElementById('la-days').value;
    const nm=+document.getElementById('la-mod').value; if(nm!==f.mi){ f.m.lessons.splice(f.li,1); C[f.c].modules[nm].lessons.push(l); }
    toast('Aula salva. Já aparece assim na área do aluno.'); render(); },
  gDelLesson:()=>{ const f=gFind(G.lesson); f.m.lessons.splice(f.li,1); G.modal=null; toast('Aula excluída'); gGo('curso',{tab:'conteudo',ctab:'aulas'}); },
  gEbook:()=>{ const x=lmOf(G.lesson); x.ebook=!x.ebook; toast(x.ebook?'E-book enviado':'E-book removido'); render(); },
  gQAdd:()=>{ quizOf(G.lesson).push({q:'',o:['','','',''],a:0,c:''}); render(); },
  gQDel:d=>{ quizOf(G.lesson).splice(+d.i,1); render(); },
  gVit:d=>{ const v=G.vendas[d.i]; v.vit=!v.vit; toast(v.vit?'Curso aparece na vitrine':'Curso saiu da vitrine'); render(); },
  gFil:d=>{ const f=G.fileiras[d.i]; f.on=!f.on; render(); },
  gTrMove:d=>{ const L=G.modal.items, i=+d.i, j=i+(+d.d); [L[i],L[j]]=[L[j],L[i]]; render(); },
  gTrDel:d=>{ G.modal.items.splice(+d.i,1); render(); },

  if(q) list=list.filter(p=>(p.title+' '+p.txt).toLowerCase().includes(q));
  const all=visibleTopics(); const chips=[['todos','Todos',all.length],['sem','Sem resposta',all.filter(p=>topicState(p)==='sem').length],['resolvidos','Resolvidos',all.filter(p=>p.solved).length],['meus','Meus tópicos',all.filter(p=>p.a===S.name||p.rep.some(r=>r.a===S.name)).length]];

    <div class="fchips sub">${courses.map(([k,l])=>`<button class="fchip sm ${cf===k?'on':''}" data-a="comC" data-k="${k}">${esc(l)}</button>`).join('')}</div>

    <div class="panel"><h3>Respostas da mentora</h3><p class="muted" style="font-size:13.5px;margin-top:4px">${esc(G.cfg.who)} costuma responder em até 24 horas nos dias úteis.</p><div class="mentor"><span class="tav m">HP</span><span><b>${esc(G.cfg.who)}</b><small>${all.filter(p=>p.rep.some(r=>r.m)||p.m).length} tópicos com resposta da mentora</small></span></div></div>
  </aside></div></div>`;

function viewTopic(){
  const p=G.posts.find(x=>x.id==S.topic); if(!p) return viewCom();
  const mine=p.a===S.name; const liked=k=>S.likes&&S.likes[k];
  const reps=p.rep.map((r,i)=>({...r,i})); const sol=p.solution!=null? reps[p.solution] : null;
  const rep = (r,isSol) => `<div class="reply ${r.m?'m':''} ${isSol?'sol':''}">${isSol?`<div class="solhead">${I.check} Solução ${p.solBy==='m'||r.m?'marcada pela mentora':'escolhida pelo autor'}</div>`:''}<div class="rhead"><span class="tav ${r.m?'m':''}">${r.ini}</span><b>${esc(r.m?r.a:shortName(r.a))}</b>${r.m?`<span class="tpill t-mentor">${esc(G.cfg.tag)}</span>`:''}<small>${r.when}</small></div><p>${esc(r.txt)}</p><div class="ract"><button class="rbtn ${liked(p.id+'-'+r.i)?'on':''}" data-a="likeR" data-i="${p.id}" data-r="${r.i}">${I.thumb} Útil ${r.likes||0}</button>${mine && !p.solved && !r.m && r.a!==S.name?`<button class="rbtn" data-a="solveMine" data-i="${p.id}" data-r="${r.i}">${I.check} Resolveu minha dúvida</button>`:''}</div></div>`;
  return `<div class="wrap" style="padding-bottom:48px"><div class="phead"><button class="back" data-a="go" data-v="com">${I.left} Comunidade</button></div>
  <div class="com-grid"><div style="min-width:0">
    <article class="tpost"><div class="tmeta"><span class="tchip">${esc(CNAME(p.course))}</span>${p.lesson&&findL(p.lesson)?`<span class="tchip ghost">Aula: ${esc(findL(p.lesson).title)}</span>`:''}${topicBadge(p)}</div>
      <h1>${esc(p.title)}</h1><div class="rhead"><span class="tav ${p.m?'m':''}">${p.ini}</span><b>${esc(p.m?p.a:shortName(p.a))}</b>${p.m?`<span class="tpill t-mentor">${esc(G.cfg.tag)}</span>`:''}<small>${p.when}</small></div>
      <p class="tbody">${esc(p.txt)}</p><div class="ract"><button class="rbtn ${liked(p.id)?'on':''}" data-a="likeT" data-i="${p.id}">${I.thumb} Útil ${p.likes||0}</button><button class="rbtn" data-a="toast" data-m="Você vai receber um aviso quando houver resposta">${I.bell.replace('<svg','<svg class="i"')} Seguir tópico</button></div></article>

/* ---------- SUPORTE ---------- */
function viewSupport(){
  const tab=S.supTab||'faq', q=(S.supQ||'').trim().toLowerCase();
  const faq=G.faq.filter(f=>!q||(f.q+' '+f.a).toLowerCase().includes(q));
  const tks=G.tickets.filter(t=>tab!=='meus'||t.who===S.name).filter(t=>!q||((t.title||t.sub)+' '+t.txt).toLowerCase().includes(q));
  const cats=[...new Set(faq.map(f=>f.cat))];
  const mine=G.tickets.filter(t=>t.who===S.name).length;
  let body='';
  if(tab==='faq') body = faq.length? cats.map(cat=>`<div class="faq-cat"><h3>${cat}</h3>${faq.filter(f=>f.cat===cat).map(f=>{ const i=G.faq.indexOf(f); const open=S.faqOpen===i; return `<div class="faq ${open?'open':''}"><button class="faq-q" data-a="faqT" data-i="${i}"><span>${esc(f.q)}</span>${I.chev}</button>${open?`<div class="faq-a">${esc(f.a)}<div class="faq-f"><small class="dim">Isso respondeu sua dúvida?</small><button class="rbtn" data-a="toast" data-m="Obrigado pelo retorno">${I.thumb} Sim</button><button class="rbtn" data-a="newTicket">Não, abrir chamado</button></div></div>`:''}</div>`; }).join('')}</div>`).join('') : `<div class="empty-c"><span>${I.help}</span><b>Nada encontrado nas perguntas frequentes</b><small>Abra um chamado e a equipe responde.</small><button class="btn btn-white btn-sm" data-a="newTicket">${I.plus} Abrir chamado</button></div>`;
  else body = tks.length? `<div class="tickets">${tks.map(t=>`<button class="ticket" data-a="openTicket" data-i="${t.id}"><span class="tid num">#${t.id}</span><span class="tmain"><span class="tmeta"><span class="tchip">${esc(t.sub)}</span>${tStatus(t.st)}</span><strong>${esc(t.title||t.txt)}</strong><span class="tby">${esc(t.who===S.name?'Você':shortName(t.who))} · ${t.when}${t.votes?` · ${t.votes} ${t.votes===1?'aluno tem':'alunos têm'} o mesmo problema`:''}</span></span><span class="tside">${I.right}</span></button>`).join('')}</div>` : `<div class="empty-c"><span>${I.wrench}</span><b>${tab==='meus'?'Você ainda não abriu chamados':'Nenhum chamado encontrado'}</b><small>Algo não funciona como deveria? Conte para a equipe.</small><button class="btn btn-white btn-sm" data-a="newTicket">${I.plus} Abrir chamado</button></div>`;
  const ab=G.tickets.filter(t=>t.st!=='resolvido').length;
  return `<div class="wrap" style="padding-bottom:48px"><div class="sup-hero"><span class="eyebrow">Suporte</span><h1>Como podemos ajudar?</h1><p class="muted">Problemas técnicos, acesso, vídeos, certificado e dúvidas sobre como a plataforma funciona. Dúvida sobre o conteúdo das aulas vai para a <button class="link" data-a="go" data-v="com" style="display:inline">Comunidade</button>.</p>
    <div class="sup-search"><label class="sfield big">${I.search.replace('<svg','<svg class="i"')}<input id="supq" placeholder="Buscar nas perguntas e nos chamados" value="${esc(S.supQ||'')}"></label><button class="btn btn-red" data-a="newTicket">${I.plus} Abrir chamado</button></div>
    <div class="sup-stats"><span><b class="num">${G.faq.length}</b> perguntas frequentes</span><span><b class="num">${G.tickets.filter(t=>t.st==='resolvido').length}</b> chamados resolvidos</span><span><b class="num">${ab}</b> em andamento</span><span>Resposta média em <b>6 h</b></span></div></div>
  <div class="tabs">${[['faq','Perguntas frequentes'],['todos','Chamados da turma'],['meus',`Meus chamados${mine?` (${mine})`:''}`]].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="supTab" data-k="${k}">${l}</button>`).join('')}</div>
  ${tab==='todos'?`<p class="muted" style="font-size:13.5px;margin:-8px 0 14px">Os chamados ficam visíveis para a turma, sem dados pessoais. Antes de abrir um novo, veja se alguém já relatou o mesmo problema e clique em “Também tenho esse problema”.</p>`:''}
  ${body}</div>`;
}
function viewTicket(){

  const voted=S.votes&&S.votes[t.id]; const steps=['aberto','analise','resolvido']; const cur=steps.indexOf(t.st);
  return `<div class="wrap" style="padding-bottom:48px"><div class="phead"><button class="back" data-a="supBack">${I.left} Suporte</button></div>
  <div class="com-grid"><div style="min-width:0"><article class="tpost"><div class="tmeta"><span class="tchip num">#${t.id}</span><span class="tchip">${esc(t.sub)}</span>${tStatus(t.st)}</div><h1>${esc(t.title||t.sub)}</h1>
    <div class="rhead"><span class="tav">${t.who.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><b>${esc(t.who===S.name?'Você':shortName(t.who))}</b><small>${t.when}</small></div><p class="tbody">${esc(t.txt)}</p>
    ${t.who!==S.name && t.st!=='resolvido'?`<div class="ract"><button class="rbtn ${voted?'on':''}" data-a="voteT" data-i="${t.id}">${I.plus} Também tenho esse problema · ${t.votes||0}</button></div>`:''}</article>
    ${t.ans?`<div class="reply m sol"><div class="solhead">${I.check} Resposta da equipe de suporte</div><div class="rhead"><span class="tav m">ES</span><b>Equipe Emergensimples</b><span class="tpill t-mentor">Suporte</span></div><p>${esc(t.ans)}</p></div>`:`<div class="reply"><p class="muted" style="margin:0">A equipe ${t.st==='analise'?'está analisando este chamado':'vai analisar este chamado'} e responde aqui. Você recebe um aviso no sininho quando houver resposta.</p></div>`}
  </div><aside class="com-side"><div class="panel"><h3>Andamento</h3><ol class="tl">${steps.map((s,i)=>`<li class="${i<=cur?'done':''} ${i===cur?'cur':''}"><span class="dot"></span><span><b>${TST[s][0]}</b><small>${(t.hist||[]).find(h=>h.st===s)?.when || (i<=cur?'':'aguardando')}</small></span></li>`).join('')}</ol></div>
  <div class="panel"><h3>Precisa de outra coisa?</h3><p class="muted" style="font-size:13.5px;margin:4px 0 12px">Cada problema em um chamado separado ajuda a equipe a resolver mais rápido.</p><button class="btn btn-line btn-sm" style="width:100%;justify-content:center" data-a="newTicket">${I.plus} Abrir outro chamado</button></div></aside></div></div>`;
}

Object.assign(act,{
  openTopic:d=>{ go('topic',{topic:+d.i}); },
  newTopic:d=>{ go('newtopic',{draft:{c:d&&d.c||S.courses[0],l:d&&d.l||''},ntErr:''}); },
  comF:d=>{ S.comF=d.k; render(); },
  comC:d=>{ S.comC=d.k; render(); },
  likeT:d=>{ S.likes=S.likes||{}; const p=G.posts.find(x=>x.id==d.i); const k=String(p.id); S.likes[k]=!S.likes[k]; p.likes=(p.likes||0)+(S.likes[k]?1:-1); render(); },
  likeR:d=>{ S.likes=S.likes||{}; const p=G.posts.find(x=>x.id==d.i); const k=p.id+'-'+d.r; S.likes[k]=!S.likes[k]; const r=p.rep[+d.r]; r.likes=(r.likes||0)+(S.likes[k]?1:-1); render(); },
  replyT:d=>{ const v=document.getElementById('rtxt').value.trim(); if(!v) return toast('Escreva sua resposta',false); G.posts.find(x=>x.id==d.i).rep.push({a:S.name,ini:S.initials,when:'agora',txt:v,likes:0}); toast('Resposta publicada'); render(); },
  solveMine:d=>{ const p=G.posts.find(x=>x.id==d.i); p.solved=true; p.solution=+d.r; p.solBy='autor'; toast('Tópico marcado como resolvido'); render(); },
  supTab:d=>{ S.supTab=d.k; render(); },
  faqT:d=>{ S.faqOpen = S.faqOpen===+d.i? null : +d.i; render(); },
  openTicket:d=>{ go('ticket',{ticket:+d.i}); },
  newTicket:()=>{ go('newticket',{tkErr:''}); },
  supBack:()=>{ go('support'); },
  voteT:d=>{ S.votes=S.votes||{}; const t=G.tickets.find(x=>x.id==d.i); S.votes[t.id]=!S.votes[t.id]; t.votes=(t.votes||0)+(S.votes[t.id]?1:-1); if(S.votes[t.id]) toast('Registrado. Você também recebe a resposta deste chamado.'); render(); }
});
document.addEventListener('input',e=>{
  if(MODE!=='aluno') return; const t=e.target;
  if(t.id==='comq'||t.id==='supq'){ if(t.id==='comq') S.comQ=t.value; else S.supQ=t.value; const pos=t.selectionStart, id=t.id; render(); const n=document.getElementById(id); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }
});
document.addEventListener('change',e=>{
  if(MODE!=='aluno') return;
  if(e.target.id==='nt-c'){ S.draft={t:document.getElementById('nt-t').value,c:e.target.value,l:''}; const x=document.getElementById('nt-x').value; render(); document.getElementById('nt-x').value=x; }
});
document.addEventListener('submit',e=>{
  if(MODE!=='aluno') return; const f=e.target;
  if(f.id==='topicForm'){ const t=document.getElementById('nt-t').value.trim(), x=document.getElementById('nt-x').value.trim();
    if(t.length<8){ S.ntErr='Escreva um título com pelo menos 8 caracteres, em forma de pergunta.'; S.draft={t,c:document.getElementById('nt-c').value,l:document.getElementById('nt-l').value}; render(); document.getElementById('nt-x').value=x; return; }
    if(x.length<15){ S.ntErr='Conte um pouco mais da sua dúvida para a turma conseguir ajudar.'; S.draft={t,c:document.getElementById('nt-c').value,l:document.getElementById('nt-l').value}; render(); document.getElementById('nt-x').value=x; return; }
    const id=Date.now(); G.posts.unshift({id,title:t,course:document.getElementById('nt-c').value,lesson:document.getElementById('nt-l').value||null,a:S.name,ini:S.initials,when:'agora',txt:x,likes:0,solved:false,solution:null,hidden:false,rep:[]});
    toast('Tópico publicado. A mentora e a turma foram avisadas.'); go('topic',{topic:id}); }
  if(f.id==='ticketForm'){ const t=document.getElementById('tk-t').value.trim(), x=document.getElementById('tk-x').value.trim();
    if(t.length<6||x.length<10){ S.tkErr='Preencha o resumo e conte o que aconteceu, para a equipe conseguir reproduzir o problema.'; render(); return; }
    const id=Math.max(...G.tickets.map(k=>k.id))+1; G.tickets.unshift({id,sub:document.getElementById('tk-s').value,title:t,who:S.name,txt:x+' ('+document.getElementById('tk-w').value+')',when:'agora',st:'aberto',ans:'',votes:0,hist:[{st:'aberto',when:'agora'}]});
    toast('Chamado #'+id+' enviado. A equipe responde aqui.'); go('ticket',{ticket:id}); }
});


/* ---------- E-BOOKS ---------- */
function ebooksOf(){
  const out=[];
  S.courses.forEach(c=>{ const k=C[c];
    lessonsOf(c).forEach((l,i)=>{ const x=(typeof lmOf==='function')?lmOf(l.id):{ebook:true}; if(x.ebook && (!x.status||x.status==='Publicada')) out.push({id:'e-'+l.id,c,l:l.id,title:l.title,kind:'E-book da aula',sub:`Aula ${i+1} · ${l.mod}`,pages:Math.max(4,Math.round(l.dur*.6))}); });
    (k.files||[]).forEach((fl,i)=>out.push({id:'f-'+c+i,c,l:null,title:fl[0],kind:'Material do curso',sub:fl[1],pages:parseInt((fl[1].match(/(\d+)\s*p/)||[])[1]||6)}));
  });
  return out;
}
function ebCover(e,isNew){ return `<div class="eb-cover" data-a="ebOpen" data-i="${e.id}" role="button" tabindex="0" aria-label="Abrir ${esc(e.title)}">${SVG[e.c]}<div class="eb-in"><span class="k">${e.kind==='E-book da aula'?'E-book':'Material'}</span><span class="t">${esc(e.title)}</span><span class="m">${esc(C[e.c].title)}</span></div>${isNew?'<span class="eb-new">NOVO</span>':''}</div>`; }
function viewEbooks(){
  const all=ebooksOf(), cf=S.ebC||'all', q=(S.ebQ||'').trim().toLowerCase(), kf=S.ebK||'todos';
  S.ebRead=S.ebRead||{};
  let list=all.filter(e=>(cf==='all'||e.c===cf)&&(kf==='todos'||(kf==='aulas'&&e.l)||(kf==='materiais'&&!e.l)||(kf==='lidos'&&S.ebRead[e.id]))&&(!q||(e.title+' '+e.sub).toLowerCase().includes(q)));
  const reading=all.filter(e=>S.ebRead[e.id]&&S.ebRead[e.id]<100);
  const card=e=>{ const p=S.ebRead[e.id]||0; const lessonDone=e.l && isDone(e.c,e.l); return `<div class="eb">${ebCover(e,!p && e.l && !lessonDone && nextLesson(e.c)?.id===e.l)}<div><strong>${esc(e.title)}</strong><br><small>${esc(e.sub)} · ${e.pages} páginas</small></div>${p?`<div class="bar ${p>=100?'ok':''}"><b style="width:${p}%"></b></div><small>${p>=100?'Lido':'Lido '+p+'%'}</small>`:''}<div class="eb-act"><button class="btn btn-white btn-sm" data-a="ebOpen" data-i="${e.id}">${I.book} ${p&&p<100?'Continuar':'Ler'}</button><button class="btn btn-line btn-sm" data-a="toast" data-m="Download de “${esc(e.title)}” iniciado" aria-label="Baixar">${I.down}</button>${e.l?`<button class="btn btn-line btn-sm" data-a="lesson" data-c="${e.c}" data-l="${e.l}" title="Ir para a aula">${I.play}</button>`:''}</div></div>`; };
  const courses=[['all','Todos os cursos'],...S.courses.map(c=>[c,C[c].title])];
  return `<div class="wrap" style="padding-bottom:48px"><div class="phead"><span class="eyebrow">Biblioteca</span><h1>E-books</h1><p class="muted" style="max-width:62ch">Os e-books de cada aula e os materiais dos seus cursos em um só lugar. Leia aqui ou baixe para estudar no plantão.</p></div>
  ${reading.length&&kf==='todos'&&!q?`<div class="eb-sec" style="margin-top:20px"><h2>Continue lendo</h2><div class="eb-grid">${reading.slice(0,4).map(card).join('')}</div></div>`:''}
  <div class="eb-bar"><label class="sfield">${I.search.replace('<svg','<svg class="i"')}<input id="ebq" placeholder="Buscar e-books e materiais" value="${esc(S.ebQ||'')}"></label></div>
  <div class="fchips">${[['todos','Todos',all.length],['aulas','E-books das aulas',all.filter(e=>e.l).length],['materiais','Materiais do curso',all.filter(e=>!e.l).length],['lidos','Já abri',Object.keys(S.ebRead).length]].map(([k,l,n])=>`<button class="fchip ${kf===k?'on':''}" data-a="ebK" data-k="${k}">${l} <span>${n}</span></button>`).join('')}</div>
  ${S.courses.length>1?`<div class="fchips sub">${courses.map(([k,l])=>`<button class="fchip sm ${cf===k?'on':''}" data-a="ebC" data-k="${k}">${esc(l)}</button>`).join('')}</div>`:'<div style="height:8px"></div>'}
  ${list.length?(cf==='all'&&S.courses.length>1&&kf==='todos'&&!q? S.courses.map(c=>`<div class="eb-sec"><h2>${esc(C[c].title)}</h2><div class="eb-grid">${list.filter(e=>e.c===c).map(card).join('')}</div></div>`).join('') : `<div class="eb-grid" style="margin-top:8px">${list.map(card).join('')}</div>`) : `<div class="empty-c"><span>${I.book}</span><b>Nenhum e-book encontrado</b><small>Tente outro termo ou limpe os filtros.</small></div>`}
  </div>
  ${S.ebOpen?ebReader():''}`;
}
function ebReader(){
  const e=ebooksOf().find(x=>x.id===S.ebOpen); if(!e) return '';
  const pg=S.ebPage||1; const pct=Math.round(pg/e.pages*100);
  return `<div class="overlay" data-a="ebClose" style="align-items:flex-start;overflow:auto"><div class="sbox" data-stop="1" style="max-width:760px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff"><div style="min-width:0"><b style="display:block">${esc(e.title)}</b><small class="dim">${esc(C[e.c].title)} · página ${pg} de ${e.pages}</small></div><div style="display:flex;gap:8px"><button class="btn btn-line btn-sm" data-a="toast" data-m="Download iniciado">${I.down} Baixar</button><button class="btn btn-white btn-sm" data-a="ebClose" data-x="1">Fechar</button></div></div>
  <div style="background:#fff;color:#1c1718;border-radius:8px;padding:clamp(22px,5vw,54px);aspect-ratio:1/1.05;max-width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(0,0,0,.5);overflow:hidden">
    <div style="font-size:11px;letter-spacing:.18em;font-weight:700;color:#e5222c;text-transform:uppercase">Emergensimples · ${esc(C[e.c].title)}</div>
    <div style="font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1;text-transform:uppercase">${esc(e.title)}</div>
    <div style="height:3px;width:60px;background:#e5222c"></div>
    ${pg===1?`<p style="margin:0;color:#4b4345;line-height:1.6">Material de apoio ${e.l?'da aula “'+esc(e.title)+'”':'do curso'}. Use junto com o vídeo: os pontos principais, os fluxogramas e as condutas em formato de consulta rápida.</p><ul style="margin:0;padding-left:18px;color:#4b4345;line-height:1.8"><li>Pontos-chave da aula</li><li>Fluxograma de decisão</li><li>Erros comuns no plantão</li><li>Checklist para imprimir</li></ul>`:`<p style="margin:0;color:#4b4345;line-height:1.6">Página ${pg}. Conteúdo ilustrativo do e-book para demonstração da leitura na plataforma.</p>${Array.from({length:6},()=>'<div style="height:9px;border-radius:4px;background:#eee7e8"></div>').join('')}`}
    <div style="margin-top:auto;font-size:12px;color:#9a8f91;display:flex;justify-content:space-between"><span>emergensimples.com.br</span><span>${pg} / ${e.pages}</span></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><button class="btn btn-line btn-sm" data-a="ebPg" data-d="-1" ${pg<=1?'disabled':''}>${I.left} Anterior</button><div class="bar" style="flex:1"><b style="width:${pct}%"></b></div><button class="btn btn-white btn-sm" data-a="ebPg" data-d="1" ${pg>=e.pages?'disabled':''}>Próxima ${I.right}</button></div></div></div>`;
}
Object.assign(act,{
  ebC:d=>{ S.ebC=d.k; render(); }, ebK:d=>{ S.ebK=d.k; render(); },
  ebOpen:d=>{ S.ebRead=S.ebRead||{}; S.ebOpen=d.i; const e=ebooksOf().find(x=>x.id===d.i); const prev=S.ebRead[d.i]||0; S.ebPage=Math.max(1,Math.round(prev/100*e.pages)); S.ebRead[d.i]=Math.max(prev,Math.round(S.ebPage/e.pages*100)); if(S.view!=='ebooks') go('ebooks'); else render(); },
  ebClose:(d,el,e)=>{ if(!d.x && e.target.closest('[data-stop]')) return; S.ebOpen=null; render(); },
  ebPg:d=>{ const e=ebooksOf().find(x=>x.id===S.ebOpen); S.ebPage=Math.min(e.pages,Math.max(1,(S.ebPage||1)+(+d.d))); S.ebRead[S.ebOpen]=Math.max(S.ebRead[S.ebOpen]||0,Math.round(S.ebPage/e.pages*100)); render(); }
});
document.addEventListener('input',e=>{ if(MODE==='aluno' && e.target.id==='ebq'){ S.ebQ=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('ebq'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} } });

loadStudent('mariana','login');
render();
document.fonts?.ready.then(()=>{ UI.ind=null; placeNavInd(); });
window.addEventListener('resize',()=>{ UI.ind=null; placeNavInd(); });
</script>
