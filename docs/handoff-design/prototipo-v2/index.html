<title>Área do Aluno Emergensimples</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,700..800&family=Barlow+Condensed:wght@700;800&family=Inter:wght@300;400;500;600;700;800&display=swap">
<style>
/* Layout: shell de streaming estilo Netflix. Hero em tela cheia, linha de cursos, depois uma faixa de painel de progresso. Tema escuro único, de propósito, igual à plataforma. */
:root{
  --bg:#0c0b0c; --surface:#151314; --surface-2:#1e1b1d; --surface-3:#2a2628;
  --line:rgba(255,236,236,.09); --line-2:rgba(255,236,236,.17);
  --fg:#f6f2f2; --muted:#b3abad; --dim:#7d7577;
  --accent:#e5222c; --accent-hi:#ff4750; --accent-soft:rgba(229,34,44,.16);
  --ok:#3fcf8e; --ok-soft:rgba(63,207,142,.14); --warn:#f2b44a; --warn-soft:rgba(242,180,74,.15);
  --paper:#ffffff; --ink:#1c1718; --ink-2:#6b6264;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gl:max(clamp(16px,4vw,56px),env(safe-area-inset-left,0px));
  --gr:max(clamp(16px,4vw,56px),env(safe-area-inset-right,0px));
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.wrap{width:100%;margin:0;padding-left:var(--gl);padding-right:var(--gr)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ico svg{width:20px;height:20px;display:block}
svg.i{width:18px;height:18px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:6px;font-weight:700;font-size:15px;white-space:nowrap;transition:transform .12s,background .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn-white{background:#fff;color:#111}
.btn-white:hover{background:#e9e4e4}
.btn-red{background:var(--accent);color:#fff}
.btn-red:hover{background:var(--accent-hi)}
.btn-ghost{background:rgba(120,110,112,.38);color:#fff}
.btn-ghost:hover{background:rgba(140,130,132,.5)}
.btn-line{border:1px solid var(--line-2);color:var(--fg)}
.btn-line:hover{background:var(--surface-2)}
.btn-ok{background:var(--ok-soft);color:var(--ok);border:1px solid rgba(63,207,142,.35)}
.btn-sm{height:36px;padding:0 14px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--fg);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link:hover{color:var(--accent-hi)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-new{background:rgba(255,255,255,.1);color:#ddd}
.p-progress{background:var(--accent-soft);color:var(--accent-hi)}
.p-exam{background:var(--warn-soft);color:var(--warn)}
.p-done{background:var(--ok-soft);color:var(--ok)}
.tag-red{background:var(--accent);color:#fff;border-radius:3px;height:22px;padding:0 8px;font-size:11px;letter-spacing:.08em}

/* progress bar */
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
.bar.ok>b{background:var(--ok)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(180deg,rgba(8,7,8,.92),rgba(8,7,8,0));transition:background .25s}
.top.solid{background:rgba(12,11,12,.6);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 1px 0 rgba(255,255,255,.07)}
.top-in{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;height:68px}
.top-in>.logo{justify-self:start}
.top-in>.nav{justify-self:center}
@media (max-width:1180px){.top-in{grid-template-columns:auto 1fr auto;gap:16px}}
@media (max-width:900px){.top-in{grid-template-columns:auto 1fr}}
.logo{display:inline-flex}
/* marca: símbolo pulso→check + logotipo em dois pesos */
.brand-lock{display:inline-flex;align-items:center;gap:10px;line-height:1}
.brand-lock .mark{width:30px;height:30px;flex:none}
.brand-lock .wm{font-family:var(--body);font-size:22px;letter-spacing:-.045em;font-weight:800;color:var(--fg)}
.brand-lock .wm b{font-weight:300;letter-spacing:-.035em;opacity:.82}
.brand-lock.lg .mark{width:38px;height:38px}
.brand-lock.lg .wm{font-size:27px}
.brand-lock.ink .wm{color:var(--ink)}
.brand-lock.ink .wm b{opacity:.7}
@media (max-width:420px){.top .brand-lock .wm{font-size:19px}.top .brand-lock .mark{width:26px;height:26px}}
/* navegação em vidro (glass) */
.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 10px 30px rgba(0,0,0,.28)}
.nav{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px}
.nav button{position:relative;z-index:1;height:36px;padding:0 15px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.66);font-weight:500;transition:color .2s,background .2s;white-space:nowrap}
.nav button:hover:not(.on){color:#fff}
.nav button.on{color:#fff}
.nav-ind{position:absolute;z-index:0;top:4px;height:36px;border-radius:999px;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.10));border:1px solid rgba(255,255,255,.30);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -6px 12px rgba(255,255,255,.04),0 6px 16px rgba(0,0,0,.35);transition:left .45s cubic-bezier(.3,1.25,.45,1),width .45s cubic-bezier(.3,1.25,.45,1),opacity .2s}
.nav-ind::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2px;border-radius:2px;background:var(--accent-hi);box-shadow:0 0 10px var(--accent-hi)}
@media (max-width:1120px){.nav button{padding:0 11px;font-size:13.5px}}



.top-act{justify-self:end;display:flex;align-items:center;gap:14px}
.ico{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background .2s}
.ico.glass:hover{background:rgba(255,255,255,.14)}
.dot{position:absolute;top:5px;right:4px;min-width:17px;height:17px;border-radius:9px;background:var(--accent);font-size:10.5px;font-weight:700;font-style:normal;display:grid;place-items:center;padding:0 4px;color:#fff}
.avatar{width:36px;height:36px;border-radius:6px;background:var(--accent);font-weight:800;font-size:13px;color:#fff}
.pop-wrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 10px);width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.6);padding:8px;z-index:70}
.pop h4{font-size:13px;padding:8px 10px 6px;display:flex;justify-content:space-between;align-items:center}
.pop-item{display:flex;gap:12px;padding:10px;border-radius:8px;text-align:left;width:100%;align-items:flex-start}
.pop-item:hover{background:var(--surface-2)}
.pop-item .ni{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);flex:none}
.pop-item strong{display:block;font-size:13.5px;font-weight:600}
.pop-item small{color:var(--dim);font-size:12px}
.pop-item.unread strong::after{content:"";display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-left:6px;vertical-align:middle}
.menu-head{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head small{display:block;color:var(--dim);font-size:12px}
.menu-btn{display:flex;gap:10px;align-items:center;width:100%;padding:10px;border-radius:8px;font-size:14px;text-align:left}
.menu-btn:hover{background:var(--surface-2)}

/* course art */
.art{position:relative;overflow:hidden;border-radius:6px;aspect-ratio:16/9;container-type:inline-size;background:#170506;max-width:100%}
.art svg{position:absolute;inset:0;width:100%;height:100%}
.art-txt{position:absolute;inset:0;padding:7cqw 6.5cqw;display:flex;flex-direction:column;justify-content:space-between}
.art-eye{font-weight:700;letter-spacing:.16em;font-size:max(9px,3.4cqw);color:rgba(255,255,255,.85)}
.art-title{font-family:var(--display);font-weight:800;font-size:10.5cqw;line-height:.9;text-transform:uppercase;color:#fff;letter-spacing:.005em}

/* hero */
.hero{position:relative;margin-top:-68px;min-height:560px;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-1}
.hero-bg svg{position:absolute;right:0;top:0;height:100%;width:72%}
.hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 26%,rgba(12,11,12,.75) 48%,rgba(12,11,12,0) 75%),linear-gradient(0deg,var(--bg) 2%,rgba(12,11,12,0) 38%)}
.hero-in{width:100%;padding-top:120px;padding-bottom:44px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end}
.hero-copy{max-width:620px;display:flex;flex-direction:column;gap:16px;animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero-kicker{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:#ddd}
.hero h1{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:clamp(38px,6.4vw,88px);line-height:.88;letter-spacing:.003em;min-height:1.76em;display:flex;align-items:flex-end}
.hero-desc{color:#ddd5d6;font-size:16px;max-width:54ch;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.hero .hero-meta{flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.hero .resume{min-height:100px;width:100%}
.hero .resume>div:last-child{flex:1;min-width:0}
.hero .resume strong,.hero .resume small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hero .hero-prog{width:100%}
@media (max-width:700px){.hero .hero-meta{flex-wrap:wrap;white-space:normal;min-height:46px;align-content:flex-start}}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.resume{display:flex;gap:14px;align-items:center;background:rgba(30,27,29,.72);backdrop-filter:blur(10px);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 14px;max-width:460px}
.resume .rthumb{width:92px;flex:none}
.resume .rthumb .art{border-radius:4px}
.resume strong{display:block;font-size:14px}
.resume small{color:var(--muted);font-size:12.5px}
.resume .bar{margin-top:7px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-prog{display:flex;flex-direction:column;gap:7px;max-width:460px}
.hero-prog .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.hero-side{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.hero-thumbs{display:flex;gap:10px}
.hthumb{width:150px;border-radius:6px;opacity:.55;transition:opacity .2s,transform .2s;outline:2px solid transparent;outline-offset:2px}
.hthumb:hover{opacity:.9}
.hthumb.on{opacity:1;outline-color:#fff}
.hero-dots{display:flex;gap:6px;align-items:center}
.hero-dots i{width:18px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.hero-dots i.on{background:#fff;width:28px}

/* sections */
.sec{padding-block:36px 8px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.sec-head h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sec-head p{color:var(--muted);font-size:14px;margin-top:3px}

/* course cards */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.ccard{display:flex;flex-direction:column;gap:12px;min-width:0}
.ccard .art{transition:transform .25s, box-shadow .25s;cursor:pointer}
.ccard .art:hover{transform:scale(1.015);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.ccard-body{display:flex;flex-direction:column;gap:9px}
.ccard-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ccard h3{font-size:17px;font-weight:700}
.ccard-next{font-size:13.5px;color:var(--muted)}
.ccard-next b{color:var(--fg);font-weight:600}
.ccard-act{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
/* botões com tamanho fixo: o rótulo muda conforme a etapa, a forma não */
.ccard-act .btn-white,.cert-card .btn-white,.dash3 .btn-white{min-width:214px;justify-content:center}
.ccard-act .btn-line{min-width:112px;justify-content:center}
.hero-cta .btn-white{min-width:238px;justify-content:center}
.hero-cta .btn-ghost{min-width:214px;justify-content:center}
.cgrid.single{grid-template-columns:1fr}
.cgrid.single .ccard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.cgrid.single .ccard h3{font-size:22px}

/* dashboard */
.band{background:linear-gradient(180deg,var(--bg),#100e0f 30%);padding-bottom:40px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k-l{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.kpi .k-v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .k-v small{font-size:15px;color:var(--dim);font-weight:600}
.kpi .k-s{font-size:12.5px;color:var(--dim)}
.up{color:var(--ok)!important}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{font-size:15px;font-weight:700}
.panel .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel .ph small{font-size:12.5px;color:var(--dim)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:11px;font-family:var(--body)}
.chart .vl{fill:var(--fg);font-weight:600}
.cprog{display:flex;flex-direction:column;gap:14px}
.cp-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;align-items:center}
.ring{position:relative;width:76px;height:76px}
.ring svg{width:76px;height:76px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:16px}
.cp-row h4{font-size:14.5px;font-weight:700}
.cp-row p{font-size:12.5px;color:var(--muted)}
.req{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.req span{font-size:11.5px;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.req span.ok{color:var(--ok);background:var(--ok-soft)}
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.step:first-child{border-top:0}
.step .si{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.step .si.red{background:var(--accent-soft);color:var(--accent-hi)}
.step .si.ok{background:var(--ok-soft);color:var(--ok)}
.step .si.warn{background:var(--warn-soft);color:var(--warn)}
.step strong{display:block;font-size:14px;font-weight:600}
.step small{color:var(--dim);font-size:12.5px}
.step .go{margin-left:auto;color:var(--dim)}
.step:hover .go{color:var(--fg)}
.dash3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;grid-auto-columns:1fr}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--surface-3)}
.heat i.l1{background:rgba(229,34,44,.32)} .heat i.l2{background:rgba(229,34,44,.55)} .heat i.l3{background:rgba(229,34,44,.8)} .heat i.l4{background:var(--accent-hi)}
.heat i.today{outline:1.5px solid #fff;outline-offset:1px}
.heat-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--dim)}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--dim);justify-content:flex-end;margin-top:10px}
.legend i{width:11px;height:11px;border-radius:2px;background:var(--surface-3)}

/* page header */
.phead{padding-top:28px;padding-bottom:8px;display:flex;flex-direction:column;gap:6px}
.phead h1{font-family:var(--display);font-weight:800;font-size:clamp(38px,5vw,56px);line-height:1;text-transform:uppercase}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:8px;width:max-content}
.back:hover{color:#fff}

/* course page */
.chero{position:relative;margin-top:-68px;padding-top:110px;padding-bottom:30px;overflow:hidden;isolation:isolate}
.chero .hero-bg svg{width:65%}
.chero-in{display:flex;flex-direction:column;gap:14px;max-width:680px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:5px 10px;border:1px solid var(--line-2);border-radius:5px;color:#ddd;display:inline-flex;gap:6px;align-items:center;background:rgba(12,11,12,.5)}
.tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{padding:12px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:14.5px}
.tabs button.on{color:#fff;border-color:var(--accent)}
.module{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;overflow:hidden}
.mod-h{display:flex;align-items:center;gap:16px;padding:16px 18px;width:100%;text-align:left}
.mod-n{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-weight:700;flex:none}
.mod-n.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.mod-h strong{display:block;font-size:16px}
.mod-h small{color:var(--dim);font-size:12.5px}
.mod-h .mbar{margin-left:auto;width:120px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;font-size:12px;color:var(--muted)}
.mod-h .mbar .bar{width:100%}
.mod-h .chev{transition:transform .2s;color:var(--dim)}
.module.open .chev{transform:rotate(180deg)}
.lrow{display:grid;grid-template-columns:30px 120px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:hover{background:var(--surface-2)}
.lrow .lst{display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:14px}
.lrow .lst.ok{color:var(--ok)}
.lrow .lst.cur{color:var(--accent-hi)}
.lrow strong{font-size:14.5px;font-weight:600;display:block}
.lrow small{color:var(--dim);font-size:12.5px}
.lrow .lbar{margin-top:6px;max-width:220px}
.lrow .lact{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.lrow.exam .lthumb{aspect-ratio:16/9;border-radius:4px;background:var(--surface-3);display:grid;place-items:center;color:var(--warn)}
.files{display:flex;flex-direction:column;gap:10px}
.file{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.file .fi{width:40px;height:48px;border-radius:5px;background:var(--surface-3);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--accent-hi);flex:none}
.file strong{font-size:14px;display:block}
.file small{color:var(--dim);font-size:12.5px}
.file .btn{margin-left:auto}

/* player */
.player{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-top:12px;padding-bottom:40px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.crumb button:hover{color:#fff}
.video{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;max-width:100%;cursor:pointer;user-select:none}
.vctrl,.vnext{cursor:default}
.video .vbg{position:absolute;inset:0;opacity:.55}
.video .vbg svg{width:100%;height:100%}
.vcenter{position:absolute;inset:0;display:grid;place-items:center}
.vplay-big{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.95);color:#111;display:grid;place-items:center;transition:transform .15s}
.vplay-big:hover{transform:scale(1.06)}
.vplay-big svg{width:30px;height:30px;margin-left:4px}
.vlabel{position:absolute;left:18px;top:16px;display:flex;flex-direction:column;gap:2px}
.vlabel b{font-family:var(--display);font-size:clamp(20px,3vw,34px);text-transform:uppercase;line-height:1}
.vlabel span{font-size:12.5px;color:#ddd}
.vdemo{position:absolute;right:14px;top:14px;font-size:11px;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px;color:#ccc}
.vctrl{position:absolute;left:0;right:0;bottom:0;padding:26px 14px 10px;background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);display:flex;flex-direction:column;gap:8px}
.vtrack{height:5px;border-radius:3px;background:rgba(255,255,255,.25);cursor:pointer;position:relative}
.vtrack b{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.vtrack em{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:var(--accent);transform:translate(-50%,-50%)}
.vrow{display:flex;align-items:center;gap:14px;font-size:13px}
.vrow .sp{margin-left:auto;display:flex;gap:14px;align-items:center;color:#ddd}
.vrow button svg{width:22px;height:22px}
.vnext{position:absolute;inset:0;background:rgba(0,0,0,.78);display:grid;place-items:center;text-align:center}
.vnext-in{display:flex;flex-direction:column;gap:12px;align-items:center;padding:20px}
.vnext h3{font-size:clamp(18px,2.4vw,24px)}
.ltitle{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin:20px 0 6px;flex-wrap:wrap}
.ltitle h1{font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.01em}
.lact-row{display:flex;gap:8px;flex-wrap:wrap}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;align-self:start;position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.side-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-h strong{font-size:15px}
.side-b{overflow-y:auto}
.smod{padding:12px 18px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700;display:flex;justify-content:space-between}
.slesson{display:flex;gap:12px;align-items:center;padding:10px 18px;width:100%;text-align:left;font-size:13.5px}
.slesson:hover{background:var(--surface-2)}
.slesson.on{background:var(--surface-3)}
.slesson .lst{width:22px;display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:12.5px;flex:none}
.slesson .lst.ok{color:var(--ok)}
.slesson .lst.cur{color:var(--accent-hi)}
.slesson small{margin-left:auto;color:var(--dim);font-size:12px;flex:none}
.about{display:flex;flex-direction:column;gap:12px;max-width:72ch;color:#ddd5d6}
.about ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.notes textarea{width:100%;min-height:90px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:12px;resize:vertical}
.note{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.note button{color:var(--accent-hi);font-weight:700;font-size:12.5px;flex:none}

/* quiz */
.quiz{max-width:760px;display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.q h3{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;gap:10px}
.q h3 span{color:var(--dim)}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer;font-size:14.5px}
.opt:hover{border-color:var(--line-2);background:var(--surface-2)}
.opt input{accent-color:var(--accent);width:17px;height:17px;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--accent);background:var(--accent-soft)}
.score{display:flex;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:20px;flex-wrap:wrap}
.score .big{font-size:44px;font-weight:800;letter-spacing:-.03em}

/* certificates */
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cert-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.cert-card .ch{display:flex;gap:14px;align-items:center}
.cert-card .ch .art{width:110px;flex:none}
.cert-card h3{font-size:16px}
.checks{display:flex;flex-direction:column;gap:8px}
.checks div{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.checks div.ok{color:var(--fg)}
.checks .cb{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.checks .ok .cb{background:var(--ok);border-color:var(--ok);color:#06150e}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;background:var(--surface-2);border-radius:10px;padding:14px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600}
.field input{height:42px;background:var(--bg);border:1px solid var(--line-2);border-radius:7px;padding:0 12px;font-size:14.5px;font-weight:500}
.field input:focus{outline:none;border-color:var(--accent-hi)}
.field .err{color:var(--accent-hi);font-weight:500}
.form .full{grid-column:1/-1}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;padding:clamp(20px,5vw,56px);position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5);aspect-ratio:1.414;display:flex;flex-direction:column;justify-content:space-between;max-width:100%;container-type:inline-size}
.paper::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.2cqw;background:var(--accent)}
.paper svg.wm{position:absolute;right:-4%;bottom:12%;width:70%;opacity:.07}
.paper .pt{font-size:max(9px,1.4cqw);letter-spacing:.2em;font-weight:700;color:var(--accent);text-transform:uppercase}
.paper .pn{font-family:var(--display);font-weight:800;font-size:6.2cqw;line-height:1;text-transform:uppercase;margin:1.4cqw 0}
.paper .pc{font-size:max(10px,1.9cqw);color:var(--ink-2);max-width:60ch;line-height:1.5}
.paper .pc b{color:var(--ink)}
.paper .pf{display:flex;justify-content:space-between;align-items:flex-end;gap:3cqw;font-size:max(8px,1.35cqw);color:var(--ink-2)}
.paper .sig{border-top:1px solid #bbb;padding-top:.8cqw;min-width:22cqw}
.paper .brand{font-weight:800;font-size:max(11px,2.2cqw);color:var(--ink)}
.cert-view{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.verify{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface-2);padding:10px 12px;border-radius:7px;display:flex;justify-content:space-between;gap:10px;align-items:center}

/* live */
.live{display:flex;flex-direction:column;gap:12px;max-width:900px}
.live-row{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.ldate{text-align:center;background:var(--surface-2);border-radius:8px;padding:8px 0}
.ldate b{display:block;font-size:24px;line-height:1}
.ldate small{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* account */
.acc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-bottom:40px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--muted)}
.toggle{width:42px;height:24px;border-radius:12px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:21px}

/* login */
.login{min-height:100vh;display:grid;align-content:center;position:relative;overflow:hidden;isolation:isolate;padding-block:56px;background:var(--bg)}
/* login: painel da marca (vermelho profundo + papel de ECG) | painel neutro de ação (mesma superfície do app) */
.login{--brand-base:#1b0608;--panel:#121011}
.login::before{content:"";position:absolute;inset:0 50% 0 0;z-index:-1;background:
  linear-gradient(rgba(255,90,96,.045) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(255,90,96,.045) 1px,transparent 1px) 0 0/32px 32px,
  radial-gradient(70% 55% at 100% 0%,rgba(229,34,44,.16),transparent 70%),
  radial-gradient(130% 100% at 0% 100%,#8a1018 0%,#4a0a10 34%,#240709 62%,var(--brand-base) 100%),
  var(--brand-base);
  box-shadow:inset -60px 0 80px -60px rgba(0,0,0,.6)}
.login::after{content:"";position:absolute;inset:0 0 0 50%;z-index:-1;background:var(--panel)}
.login-inner{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.login-art{display:flex;flex-direction:column;gap:clamp(28px,4vh,44px);min-width:0;justify-self:center;width:calc(100% - var(--gl) - 48px);max-width:560px;margin-left:calc(var(--gl) - 24px)}


.monitor{position:relative;border:1px solid rgba(255,90,96,.18);border-radius:14px;background:
  linear-gradient(rgba(255,70,78,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(255,70,78,.07) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(rgba(255,70,78,.035) 1px,transparent 1px) 0 0/8px 8px,
  linear-gradient(90deg,rgba(255,70,78,.035) 1px,transparent 1px) 0 0/8px 8px,
  rgba(10,6,7,.55);overflow:hidden;max-width:720px}
.monitor-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,220,222,.55);font-weight:700}
.monitor-top .rec{display:inline-flex;align-items:center;gap:7px;color:#ff6a70}
.monitor-top .rec i{width:7px;height:7px;border-radius:50%;background:#ff4750;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
#mon{display:block;width:100%;height:150px}
.vitals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(255,90,96,.14)}
.vital{padding:10px 16px 12px;border-left:1px solid rgba(255,90,96,.14);min-width:0}
.vital:first-child{border-left:0}
.vital small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,220,222,.5);font-weight:700}
.vital b{font-family:var(--display);font-weight:700;font-size:clamp(26px,2.6vw,36px);line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
.vital b em{font-style:normal;font-size:.45em;color:rgba(255,220,222,.55);margin-left:4px;font-family:var(--body);font-weight:600}
.vital.hr b{color:#ff5a61}
.vital .heart{display:inline-block;width:9px;height:9px;margin-left:6px;background:#ff4750;border-radius:50%;opacity:.25;transition:opacity .08s}
.vital .heart.on{opacity:1;box-shadow:0 0 10px #ff4750}
.login-copy{display:flex;flex-direction:column;gap:14px}
.login-art h2{font-family:var(--display);font-weight:800;font-size:clamp(40px,4.4vw,68px);line-height:.92;text-transform:uppercase;max-width:13ch}
.login-art h2 span{color:var(--accent-hi)}
.login-art p{color:#e5dcdd;max-width:44ch}
.feats{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);margin-top:4px}
.feats span{display:inline-flex;gap:7px;align-items:center}
.feats svg{color:var(--accent-hi)}
.login-form{min-width:0;justify-self:center;width:calc(100% - var(--gr) - 48px);max-width:420px;margin-right:calc(var(--gr) - 24px)}
.login-box{width:100%;display:flex;flex-direction:column;gap:16px}
.login-box h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
.login-box .field input{height:48px}
.login-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--muted)}
.login-row label{display:flex;gap:8px;align-items:center;cursor:pointer}
.login-row input{accent-color:var(--accent)}
.login-box .btn{height:50px;justify-content:center;width:100%;font-size:16px}
.hint{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.hint b{color:var(--fg)}

/* search */
.overlay{position:fixed;inset:0;background:rgba(5,4,5,.82);backdrop-filter:blur(6px);z-index:80;padding:calc(80px + env(safe-area-inset-top,0px)) var(--gr) 20px var(--gl);display:flex;justify-content:center}
.sbox{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
.sbox input{height:54px;border-radius:10px;background:var(--surface);border:1px solid var(--line-2);padding:0 18px;font-size:17px;width:100%}
.sbox input:focus{outline:none;border-color:var(--accent-hi)}
.sres{background:var(--surface);border:1px solid var(--line);border-radius:10px;max-height:60vh;overflow:auto}
.sres button{display:flex;gap:14px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-top:1px solid var(--line)}
.sres button:first-child{border-top:0}
.sres button:hover{background:var(--surface-2)}
.sres small{color:var(--dim);display:block;font-size:12px}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:#fff;color:#111;font-weight:600;font-size:14px;padding:12px 16px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;gap:10px;align-items:center;animation:fadeUp .25s ease both}
.toast svg{color:#13854f}

/* presenter */
.pres-btn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:75;height:44px;padding:0 16px;border-radius:22px;background:#fff;color:#111;font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.pres{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:76;width:min(340px,calc(100vw - 32px));max-height:calc(100vh - 110px);overflow:auto;background:#fbf8f8;color:#1c1718;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6);padding:16px;display:flex;flex-direction:column;gap:14px}
.pres h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7d7072}
.pres .stu{display:flex;flex-direction:column;gap:6px}
.pres .stu button{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:9px;border:1.5px solid #e6dfe0}
.pres .stu button.on{border-color:var(--accent);background:#fff0f0}
.pres .stu b{display:block;font-size:13.5px}
.pres .stu small{font-size:12px;color:#6b6264}
.pres .sav{width:32px;height:32px;border-radius:6px;background:var(--accent);color:#fff;font-weight:800;font-size:11.5px;display:grid;place-items:center;flex:none}
.pres ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;counter-reset:s}
.pres ol button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:7px;font-size:13.5px;font-weight:500}
.pres ol button:hover{background:#f0e8e9}
.pres ol button::before{counter-increment:s;content:counter(s);width:22px;height:22px;border-radius:50%;background:#eee5e6;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.pres .reset{font-size:13px;font-weight:700;color:var(--accent);text-align:left}

/* tabbar mobile */
.tabbar{display:none}

@media (max-width:1080px){
  .player{grid-template-columns:minmax(0,1fr)}
  .side{position:static;max-height:none}
  .hero-thumbs{display:none}
}
@media (max-width:900px){
  .nav{display:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash,.dash3,.acc,.cert-view{grid-template-columns:minmax(0,1fr)}
  .login{align-content:start;padding-block:0}
  .login::before{inset:0}
  .login::after{inset:auto 0 0 0;top:var(--split,48%)}
  .login-inner{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;min-height:100vh}
  .login-art{gap:22px;max-width:none;width:auto;margin:0;justify-self:stretch;padding:32px var(--gr) 28px var(--gl)}
  .login-form{max-width:none;width:auto;margin:0;justify-self:stretch;align-self:stretch;padding:28px var(--gr) 40px var(--gl);background:var(--panel)}
  .login::after{display:none}
  .login-art p,.feats{display:none}
  #mon{height:110px}
  .vital{padding:8px 12px 10px}
  .vital b em{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:55;border-radius:26px;padding:6px;background:linear-gradient(180deg,rgba(40,36,38,.62),rgba(20,18,19,.62));border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 14px 34px rgba(0,0,0,.5)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:rgba(255,255,255,.55);padding:7px 0;border-radius:20px;border:1px solid transparent;transition:background .2s,color .2s}
  .tabbar button.on{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .tabbar button.on svg{color:var(--accent-hi)}
  .tabbar svg{width:22px;height:22px}
  main{padding-bottom:104px}
  .pres-btn{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .pres{bottom:calc(148px + env(safe-area-inset-bottom,0px))}
  .toasts{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:700px){
  .hero{min-height:0}
  .hero-bg svg{width:100%;height:62%;opacity:.8}
  .hero-bg::after{background:linear-gradient(0deg,var(--bg) 40%,rgba(12,11,12,.55) 70%,rgba(12,11,12,.2))}
  .hero-in{grid-template-columns:minmax(0,1fr);padding-top:170px;padding-bottom:24px}
  .hero-side{align-items:flex-start}
  .hero-cta .btn{flex:1;justify-content:center}
  .cgrid,.certs{grid-template-columns:minmax(0,1fr)}

}

/* ================= GOMUT · PAINEL DO PRODUTOR ================= */
.gm{--g-bg:#fff;--g-soft:#f5f8f7;--g-line:#e3e8e6;--g-line2:#cbd5d2;--g-ink:#1d2422;--g-ink2:#46514e;--g-mute:#6c7774;--g-teal:#08736a;--g-teal-d:#065d56;--g-tint:#e5efeb;--g-tint2:#d4e5df;--g-amber:#f7a935;--g-amber-soft:#fde2c2;--g-red:#c23a2b;--g-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  min-height:100vh;background:var(--g-bg);color:var(--g-ink);font-family:var(--body);font-size:15px;color-scheme:light}
body.gm-on{background:#fff}
body.gm-on::before{background:#fff}
.gm *{box-sizing:border-box}
.gm :focus-visible{outline:2px solid var(--g-teal);outline-offset:2px}
.g-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;height:68px;background:#fff;border-bottom:1px solid var(--g-line);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.g-logo{display:flex;align-items:center;gap:10px}
.g-logo img{height:40px;width:auto;mix-blend-mode:multiply;display:block}
.g-role{background:var(--g-teal);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.14em;padding:4px 8px;border-radius:2px}
.g-top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.g-av{width:32px;height:32px;border-radius:5px;background:linear-gradient(180deg,#0b7f75,#065d56);color:#fff;font-weight:700;font-size:12px;display:grid;place-items:center}
.g-avbtn{display:flex;align-items:center;gap:6px;color:var(--g-ink)}
.g-ham{display:none;width:40px;height:40px;border-radius:6px;place-items:center;border:1px solid var(--g-line2)}
.g-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 68px)}
.g-side{border-right:1px solid var(--g-line);padding:28px 12px;display:flex;flex-direction:column;gap:2px;background:#fff}
.g-nav{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border-radius:4px;color:var(--g-ink2);font-size:16px;font-weight:500;width:100%;text-align:left;border-left:3px solid transparent}
.g-nav svg{width:18px;height:18px;color:var(--g-ink2);flex:none}
.g-nav:hover{background:var(--g-soft);color:var(--g-ink)}
.g-nav.on{background:var(--g-tint);color:var(--g-ink);font-weight:600;border-left-color:var(--g-teal)}
.g-nav.on svg{color:var(--g-teal)}
.g-nav .cnt{margin-left:auto;font-size:11px;font-weight:700;background:var(--g-amber-soft);color:#7a4a08;border-radius:99px;padding:2px 7px}
.g-main{padding:44px max(24px,4vw) 40px;min-width:0}
.g-wrap{max-width:1106px}
.g-crumb{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--g-mute);margin-bottom:6px;flex-wrap:wrap}
.g-crumb button{color:var(--g-ink);font-weight:500}
.g-crumb button:hover{color:var(--g-teal)}
.g-crumb svg{width:16px;height:16px}
.g-h1{font-family:var(--g-disp);font-weight:800;font-stretch:87%;font-size:clamp(36px,4vw,50px);letter-spacing:-.035em;line-height:1.05;margin:0}
.g-sub{color:var(--g-ink2);font-size:16px;margin-top:8px;max-width:62ch;line-height:1.5}
.g-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.g-head-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g-foot{border-top:1px solid var(--g-line);margin-top:56px;padding-top:18px;font-size:13px;color:var(--g-mute)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:34px;padding:0 14px;border:1px solid var(--g-line2);border-radius:3px;background:#fff;color:var(--g-ink);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.gbtn:hover{background:var(--g-soft);border-color:#aebcb8}
.gbtn svg{width:16px;height:16px}
.gbtn-lg{height:42px;padding:0 20px;font-size:16px}
.gbtn-p{background:var(--g-teal);border-color:var(--g-teal);color:#fff}
.gbtn-p:hover{background:var(--g-teal-d);border-color:var(--g-teal-d)}
.gbtn-dark{background:#1f2422;border-color:#1f2422;color:#fff}
.gbtn-dark:hover{background:#000;border-color:#000}
.gbtn-danger{background:var(--g-red);border-color:var(--g-red);color:#fff}
.gbtn-danger:hover{background:#a52f22}
.gbtn[disabled]{opacity:.45;cursor:not-allowed}
.gbtn-sq{width:34px;padding:0}
.gpill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;white-space:nowrap}
.gp-ok{background:var(--g-tint);color:var(--g-teal-d)}
.gp-out{border:1px solid var(--g-line2);color:var(--g-ink2);background:#fff}
.gp-warn{background:var(--g-amber-soft);color:#5b3604}
.gp-dark{background:var(--g-teal);color:#fff}
.gp-grey{background:#eceeed;color:#4b5552}
.gp-red{background:#fbe1dd;color:#9b2c20}
.gtabs{display:flex;gap:32px;border-bottom:1px solid var(--g-line);margin-bottom:30px;overflow-x:auto}
.gtabs button{padding:14px 0 12px;font-size:17px;font-weight:500;color:var(--g-ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.gtabs button.on{color:var(--g-ink);font-weight:600;border-color:var(--g-teal)}
.gtabs.sm button{font-size:16px}
.gcard{border:1px solid var(--g-line);border-radius:10px;background:#fff;padding:26px}
.gcard h3{font-size:18px;font-weight:600;margin:0}
.gcard .gc-sub{font-size:14px;color:var(--g-mute);margin-top:4px}
.gfield{display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--g-ink2);font-weight:500;min-width:0}
.gfield input,.gfield textarea,.gfield select{height:46px;border:1px solid var(--g-line2);border-radius:3px;padding:0 14px;font-size:16px;color:var(--g-ink);background:#fff;font-family:var(--body);width:100%}
.gfield textarea{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.gfield input:focus,.gfield textarea:focus,.gfield select:focus{outline:none;border-color:var(--g-teal);box-shadow:0 0 0 2px var(--g-teal)}
.gfield input::placeholder,.gfield textarea::placeholder{color:#8a9592}
.ghelp{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--g-mute);font-weight:400}
.gform{display:flex;flex-direction:column;gap:22px}
.grow2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.grow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.gsearch{display:flex;align-items:center;gap:10px;height:38px;border:1px solid var(--g-line2);border-radius:3px;padding:0 12px;width:min(340px,100%);color:var(--g-mute)}
.gsearch input{border:0;outline:0;flex:1;font-size:14.5px;min-width:0;background:transparent;color:var(--g-ink)}
.gsearch svg{width:16px;height:16px}
.gtoggle{width:46px;height:26px;border-radius:13px;background:#c9d3d0;position:relative;flex:none;transition:background .2s}
.gtoggle::after{content:"";position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s,background .2s}
.gtoggle.on{background:var(--g-teal)}
.gtoggle.on::after{left:24px;background:var(--g-amber)}
.glist-row{display:flex;align-items:center;gap:14px;padding:18px 0;border-top:1px solid var(--g-line)}
.glist-row:first-child{border-top:0}
.glist-row .gl-t{font-weight:600;font-size:16px}
.glist-row .gl-s{font-size:14px;color:var(--g-mute);margin-top:3px}
.glist-row .gl-r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.g-chips{display:flex;gap:8px;flex-wrap:wrap}
.g-chip{height:36px;padding:0 15px;border:1px solid var(--g-line2);border-radius:99px;font-size:14.5px;color:var(--g-ink);background:#fff;white-space:nowrap}
.g-chip.on{background:#1f2422;border-color:#1f2422;color:#fff;font-weight:600}
.g-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:90px 20px;color:var(--g-ink2)}
.g-empty svg{width:40px;height:40px;color:#9fb3ad}
.g-empty h3{font-size:21px;color:var(--g-ink);margin:0}

/* cursos */
.g-cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px 20px}
.g-ccard{display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.g-ccard .art{border-radius:4px;transition:box-shadow .2s,transform .2s}
.g-ccard:hover .art{box-shadow:0 14px 30px rgba(0,0,0,.18);transform:translateY(-2px)}
.g-ccard h4{font-size:16px;font-weight:600;margin:4px 0 0}
.g-ccard small{color:var(--g-mute);font-size:14px}

.g-ccard.new .art{background:var(--g-tint);display:grid;place-items:center;color:var(--g-teal);border:1.5px dashed #a9c6be}

/* visão geral */
.g-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:44px}
.g-kpi{border:1px solid var(--g-line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.g-kpi .k1{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--g-ink2)}
.g-kpi .k1 svg{width:17px;height:17px;color:var(--g-teal)}
.g-kpi .k2{font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.g-kpi .k3{font-size:13px;color:var(--g-mute)}
.g-sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.g-sec-h h2{font-size:24px;font-weight:600;margin:0;letter-spacing:-.01em}
.g-sec-h small{font-size:14.5px;color:var(--g-ink2)}
.g-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g-tools h5{font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g-ink2);margin:0 0 10px}
.g-tool{display:flex;align-items:center;gap:14px;background:var(--g-tint);border-radius:3px;padding:12px 16px 12px 14px;margin-bottom:9px;width:100%;text-align:left;transition:background .15s}
.g-tool:hover{background:var(--g-tint2)}
.g-tool .ti{width:40px;height:40px;border-radius:3px;background:var(--g-tint2);display:grid;place-items:center;color:var(--g-teal);flex:none}
.g-tool .ti svg{width:18px;height:18px}
.g-tool strong{display:block;font-size:15px;font-weight:600}
.g-tool small{display:block;font-size:13.5px;color:var(--g-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-tool .tr{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;color:var(--g-ink2)}
.g-tool .tr svg{width:18px;height:18px}
.g-2col{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:44px}
.g-rel{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 0;border-top:1px solid var(--g-line)}
.g-rel strong{font-size:16px;font-weight:600}
.g-rel small{display:block;font-size:14px;color:var(--g-mute);margin-top:3px}
.g-date{font-size:11.5px;font-weight:700;letter-spacing:.08em;border:1px solid var(--g-line2);border-radius:2px;padding:3px 7px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.g-date svg{width:11px;height:11px}
.g-att{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid var(--g-line);width:100%;text-align:left}
.g-att:first-of-type{border-top:0}
.g-att strong{font-size:16px;font-weight:600}
.g-att small{display:block;font-size:14px;color:var(--g-mute);margin-top:3px}
.g-att svg{width:18px;height:18px;color:var(--g-ink2)}
.g-live{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:16px;align-items:center;border:1px solid var(--g-line);border-radius:6px;padding:16px;margin-bottom:10px}
.g-live .ld{background:#d6e5df;border-radius:2px;text-align:center;padding:9px 0}
.g-live .ld b{display:block;font-size:24px;line-height:1;font-weight:700}
.g-live .ld small{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--g-ink2)}
.g-live strong{display:block;font-size:17px;font-weight:600;margin:5px 0 2px}
.g-live .lm{font-size:14.5px;color:var(--g-ink2)}

/* módulos */
.g-mod{border:1px solid var(--g-line2);border-radius:10px;margin-bottom:14px;background:#fff}
.g-mod-h{display:flex;gap:16px;align-items:center;padding:20px 18px 16px;width:100%;text-align:left}
.g-mod-n{width:52px;height:52px;border-radius:50%;border:2px solid #b9c7c3;display:grid;place-items:center;font-size:19px;font-weight:600;color:var(--g-ink2);flex:none}
.g-mod-h .mt{font-size:12.5px;letter-spacing:.14em;font-weight:600;color:var(--g-ink2)}
.g-mod-h strong{display:block;font-size:19px;font-weight:600;margin:2px 0}
.g-mod-h .mm{font-size:14.5px;color:var(--g-ink2)}

.g-mod-act{display:flex;gap:8px;padding:0 18px 16px}
.g-les{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--g-line);margin:0 18px}

.g-les .ld{font-size:14px;color:var(--g-ink2);align-self:start;padding-top:2px}

.g-newrow{display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid var(--g-line);margin:0 18px}

.g-vprev{background:#0f1c1a;border-radius:3px;aspect-ratio:16/9;display:grid;place-items:center;color:#c9d6d3;text-align:center;padding:20px;font-size:14px;gap:8px;max-width:100%}

.g-file{display:flex;align-items:center;gap:14px;background:var(--g-tint);border-radius:3px;padding:14px}

.g-file small{color:var(--g-ink2);font-size:13px}
.g-q{background:var(--g-tint);border:1px solid #cfe0da;border-radius:4px;padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.g-q-h{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.g-q textarea{min-height:80px;border:1px solid var(--g-line2);border-radius:3px;padding:12px 14px;font-size:16px;font-family:var(--body);resize:vertical;width:100%}
.g-q .opt{display:flex;gap:12px;align-items:center}
.g-q .opt input[type=radio]{accent-color:var(--g-teal);width:20px;height:20px;flex:none}
.g-q .opt input[type=text],.g-q .cmt{flex:1;height:38px;border:1px solid var(--g-line2);border-radius:3px;padding:0 14px;font-size:14.5px;background:#fff;width:100%;min-width:0}

/* listas: trilhas / vendas / encontros */
.g-row{display:flex;gap:16px;align-items:center;border:1px solid var(--g-line);border-radius:6px;padding:20px 16px;margin-bottom:10px}
.g-row .rn{width:40px;height:40px;border-radius:50%;border:2px solid #b9c7c3;display:grid;place-items:center;font-weight:600;color:var(--g-ink2);flex:none}
.g-row strong{display:block;font-size:17px;font-weight:600}
.g-row .rd{font-size:15px;color:var(--g-ink2);margin-top:3px}
.g-row .rs{font-size:12.5px;color:var(--g-mute);margin-top:5px}
.g-row .ra{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.g-sale{display:flex;gap:16px;align-items:center;padding:12px 10px;border-bottom:1px solid transparent}
.g-sale .art{width:128px;flex:none;border-radius:2px}
.g-sale .art .art-txt{display:none}
.g-sale strong{display:block;font-size:17px;font-weight:600}
.g-sale .sm{font-size:15px;color:var(--g-ink2);margin:3px 0 6px}
.g-sale .sa{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none;font-size:15px;color:var(--g-ink2)}

/* tabela alunos */
.g-table-wrap{border:1px solid var(--g-line);border-radius:10px;overflow-x:auto}
.g-table{width:100%;border-collapse:collapse;min-width:980px}
.g-table th{background:var(--g-tint);text-align:left;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--g-ink2);padding:14px 16px}
.g-table td{padding:14px 16px;border-top:1px solid var(--g-line);font-size:15px;vertical-align:middle}
.g-stu{display:flex;gap:12px;align-items:center}
.g-stu .sa{width:32px;height:32px;border-radius:50%;background:#bccbc6;color:#2b3633;font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.g-stu strong{display:block;font-size:15.5px;font-weight:600}
.g-stu small{display:block;font-size:13px;color:var(--g-mute);line-height:1.5}
.g-prog{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums;font-size:14.5px}
.g-prog i{display:block;width:90px;height:4px;background:#e1e7e5;border-radius:3px;position:relative;overflow:hidden}
.g-prog i b{position:absolute;inset:0 auto 0 0;background:var(--g-teal);border-radius:3px}
.g-cc{display:flex;gap:5px;flex-wrap:wrap}
.g-cc span{font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:3px;background:#f0e3e4;color:#8f1d24;white-space:nowrap}
.g-cc span.pl{background:#efe7dc;color:#6b4a14}

/* comunidade */
.g-post{border:1px solid var(--g-line);border-radius:10px;padding:22px 18px;margin-bottom:12px;max-width:760px}
.g-pa{display:flex;gap:14px}
.g-pa .av{width:40px;height:40px;border-radius:50%;background:#bccbc6;color:#2b3633;font-size:13px;font-weight:700;display:grid;place-items:center;flex:none}
.g-pa .av.m{background:linear-gradient(180deg,#0b7f75,#065d56);color:#fff}
.g-pa .pn{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.g-pa .pn b{font-weight:600}
.g-pa .pn small{color:var(--g-mute);font-size:14px}
.g-pa .pt{font-size:17px;line-height:1.5;margin-top:4px;color:var(--g-ink)}
.g-replies{margin:16px 0 0 54px;padding-top:16px;border-top:1px solid var(--g-line);display:flex;flex-direction:column;gap:18px}
.g-replies .g-pa .av{width:32px;height:32px;font-size:12px}
.g-replies .pt{font-size:15px}
.g-reply{display:flex;gap:10px;align-items:center;margin-left:54px;margin-top:16px}
.g-reply input{flex:1;height:38px;border:1px solid var(--g-line2);border-radius:3px;padding:0 14px;font-size:14.5px;min-width:0}
.g-reply input:focus{outline:none;border-color:var(--g-teal);box-shadow:0 0 0 2px var(--g-teal)}

/* chamados */
.g-tk{background:var(--g-tint);border-radius:4px;margin-bottom:12px;max-width:860px}
.g-tk-h{display:flex;align-items:center;gap:12px;padding:14px;width:100%;text-align:left}
.g-tk-h .id{font-size:13px;font-weight:600;color:var(--g-ink2)}
.g-tk-h strong{font-size:15px;font-weight:600}
.g-tk-h small{display:block;font-size:13px;color:var(--g-ink2);margin-top:2px}
.g-tk-h .r{margin-left:auto;display:flex;gap:12px;align-items:center;flex:none}
.g-tk-b{padding:0 14px 14px 14px;display:flex;flex-direction:column;gap:10px}
.g-tk-b textarea{min-height:96px;border:1px solid var(--g-line2);border-radius:3px;padding:12px 14px;font-size:16px;font-family:var(--body);background:#fff;resize:vertical;width:100%}
.g-tk-b .ans{background:#fff;border-radius:3px;padding:12px 14px;font-size:14.5px;border-left:3px solid var(--g-teal)}

/* certificado preview */
.g-cert{position:relative;max-width:640px;aspect-ratio:1.414;background:#fff;box-shadow:0 20px 50px rgba(0,0,0,.12);border:1px solid var(--g-line);padding:20px 20px 20px 40px;container-type:inline-size}
.g-cert::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:#e5222c}
.g-cert-in{border:1px solid #222;height:100%;padding:5cqw 4cqw;display:flex;flex-direction:column;justify-content:space-between}
.g-cert .eb{font-size:max(9px,1.6cqw);letter-spacing:.2em;color:#666;text-transform:uppercase;margin-top:3cqw}
.g-cert .nm{font-family:var(--g-disp);font-weight:800;font-stretch:87%;font-size:6cqw;letter-spacing:-.03em;margin:1cqw 0}
.g-cert .tx{font-size:max(10px,2cqw)}
.g-cert .sg{border-top:1px solid #222;width:26cqw;padding-top:1cqw;font-size:max(9px,1.8cqw);font-weight:700}
.g-cert .sg small{display:block;font-weight:400;font-size:max(8px,1.5cqw);color:#444}

/* relatórios */
.g-bars svg{width:100%;height:auto;display:block}
.g-bars text{font-family:var(--body);font-size:11px;fill:#6c7774}
.g-hbar{display:grid;grid-template-columns:minmax(0,1fr) 140px 44px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--g-line);font-size:14.5px}
.g-hbar:first-of-type{border-top:0}
.g-hbar i{display:block;height:8px;border-radius:4px;background:#e1e7e5;position:relative;overflow:hidden}
.g-hbar i b{position:absolute;inset:0 auto 0 0;background:var(--g-teal);border-radius:4px}
.g-hbar span{text-align:right;font-variant-numeric:tabular-nums;color:var(--g-ink2)}

/* modal */
.g-modal-bg{position:fixed;inset:0;background:rgba(40,55,52,.55);z-index:85;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.g-modal{position:relative;background:#fff;border-radius:10px;width:min(760px,100%);padding:38px;box-shadow:0 30px 80px rgba(0,0,0,.3);color:var(--g-ink);font-family:var(--body)}
.g-modal h2{font-family:var(--g-disp);font-weight:800;font-stretch:87%;font-size:30px;letter-spacing:-.03em;margin:0 0 18px}
.g-modal .x{position:absolute;right:16px;top:16px;width:36px;height:36px;border-radius:50%;background:var(--g-tint);display:grid;place-items:center}
.g-modal .x svg{width:18px;height:18px}
.g-modal-f{display:flex;justify-content:flex-end;gap:10px;margin-top:26px}
.g-modal p{font-size:16px;line-height:1.55;color:var(--g-ink2);margin:0}
.g-ord{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--g-line)}
.g-ord span{flex:1;font-weight:600;font-size:16px}

/* menu conta */
.g-menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:#fff;border:1px solid var(--g-line);border-radius:8px;box-shadow:0 20px 40px rgba(0,0,0,.14);padding:6px;z-index:60}
.g-menu .mh{padding:10px 12px;border-bottom:1px solid var(--g-line);margin-bottom:4px}
.g-menu .mh b{display:block;font-size:14.5px}
.g-menu .mh small{font-size:12.5px;color:var(--g-mute)}
.g-menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:5px;font-size:14.5px;text-align:left;color:var(--g-ink)}
.g-menu button:hover{background:var(--g-soft)}
.g-menu svg{width:17px;height:17px;color:var(--g-ink2)}

/* login gomut */
.g-login{min-height:100vh;background:radial-gradient(55% 60% at 50% 50%,#0b6058 0%,#0e3a35 55%,#13221f 100%);color:#fff;display:flex;flex-direction:column;padding:22px max(16px,3.4vw) 24px;position:relative;overflow:hidden}
.g-login-bar{background:rgba(232,237,236,.94);border-radius:8px;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 28px}
.g-login-bar img{height:40px;mix-blend-mode:multiply}
.g-login-bar button{color:var(--g-teal);font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center}
.g-login-in{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,372px);align-items:center;gap:40px;position:relative}
.g-login-wm{position:absolute;left:50%;top:50%;width:min(560px,60vw);transform:translate(-62%,-50%);-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent);mask-image:radial-gradient(closest-side,#000 70%,transparent);pointer-events:none}
.g-login h1{font-family:var(--g-disp);font-weight:800;font-stretch:87%;font-size:clamp(44px,4.6vw,66px);letter-spacing:-.035em;line-height:1.05;margin:0;position:relative}
.g-login .ls{margin-top:22px;color:#d6e3e0;font-size:16px;line-height:1.5;max-width:28ch;position:relative}
.g-login-card{position:relative;background:rgba(12,24,22,.88);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:34px}
.g-login-card h2{font-size:22px;font-weight:600;margin:0}
.g-login-card p{font-size:14px;color:#c9d6d3;margin:8px 0 18px}
.g-login-card input{display:block;width:100%;height:52px;margin-bottom:18px;background:#0a1614;border:1px solid #4f625e;border-radius:2px;padding:0 15px;color:#fff;font-size:16px}
.g-login-card input:focus{outline:none;border-color:var(--g-amber)}
.g-login-card .go{width:100%;height:52px;background:var(--g-amber);color:#1b1206;font-weight:600;font-size:17px;border-radius:2px}
.g-login-card .go:hover{background:#ffb84f}
.g-login-f{text-align:center;font-size:12.5px;color:#9db1ad;position:relative}

@media (max-width:1100px){.g-tools{grid-template-columns:repeat(2,minmax(0,1fr))}.g-lesson{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .g-shell{grid-template-columns:minmax(0,1fr)}
  .g-side{position:fixed;left:0;top:68px;bottom:0;width:min(290px,84vw);z-index:45;transform:translateX(-102%);transition:transform .25s;box-shadow:20px 0 40px rgba(0,0,0,.15);padding-left:max(12px,env(safe-area-inset-left,0px))}
  .g-side.open{transform:none}
  .g-scrim{position:fixed;inset:68px 0 0 0;background:rgba(30,40,38,.35);z-index:44}
  .g-ham{display:grid}
  .g-top .gbtn .lbl{display:none}
  .g-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-2col,.grow2,.grow3{grid-template-columns:minmax(0,1fr)}
  .g-main{padding-top:30px}
  .g-login-in{grid-template-columns:minmax(0,1fr);gap:28px;padding-top:40px}
  .g-login-wm{opacity:.5}
}
@media (max-width:640px){
  .g-tools{grid-template-columns:minmax(0,1fr)}
  .g-logo img{height:30px}
  .g-role{display:none}
  .g-les{grid-template-columns:24px minmax(0,1fr);margin:0 12px;padding:14px 6px}
  .g-les .ld{grid-column:2}
  .g-les .la{grid-column:2}
  .g-row,.g-sale{flex-wrap:wrap}
  .g-row .ra,.g-sale .sa{margin-left:0;width:100%;flex-wrap:wrap}
  .g-live{grid-template-columns:52px minmax(0,1fr)}
  .g-live>div:last-child{grid-column:1/-1}
  .g-modal{padding:28px 20px}
  .g-replies,.g-reply{margin-left:0}
  .g-hbar{grid-template-columns:minmax(0,1fr) 80px 40px}
  .glist-row{flex-wrap:wrap}
  .glist-row .gl-r{margin-left:0}
}

.pres .seg{display:flex;gap:6px;margin-top:8px}
.pres .segb{flex:1;height:36px;border-radius:9px;border:1.5px solid #e6dfe0;font-size:13px;font-weight:700;color:#1c1718}
.pres .segb.on{border-color:var(--accent);background:#fff0f0}

/* ===== comunidade e suporte (aluno) ===== */
.com-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:18px}
.com-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px}
.com-bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sfield{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:8px;background:var(--surface);border:1px solid var(--line-2);color:var(--dim)}
.sfield input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--fg);font-size:15px}
.sfield:focus-within{border-color:var(--accent-hi)}
.sfield.big{height:52px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.fchips.sub{margin-bottom:18px}
.fchip{height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line-2);font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.fchip span{font-size:11.5px;background:var(--surface-3);color:var(--muted);border-radius:99px;padding:1px 7px}
.fchip:hover{color:var(--fg)}
.fchip.on{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));border-color:rgba(255,255,255,.28);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.fchip.sm{height:30px;font-size:12.5px;font-weight:500}
.topics{display:flex;flex-direction:column;gap:8px}
.topic{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;transition:border-color .15s,background .15s}
.topic:hover{border-color:var(--line-2);background:var(--surface-2)}
.topic.cmp{grid-template-columns:32px minmax(0,1fr);padding:12px;background:transparent;border-color:transparent;border-bottom:1px solid var(--line);border-radius:0}
.topic.cmp .tside{display:none}
.topic.cmp .tav{width:32px;height:32px;font-size:11px}
.tav{width:40px;height:40px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#ddd;flex:none}
.tav.m{background:linear-gradient(180deg,#ff4b53,#c3141d);color:#fff}
.tmain{display:flex;flex-direction:column;gap:5px;min-width:0}
.tmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tchip{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-3);padding:3px 8px;border-radius:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tchip.ghost{background:transparent;border:1px solid var(--line-2)}
.tmain strong{font-size:15.5px;font-weight:600;line-height:1.35}
.tex{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tby{font-size:12.5px;color:var(--dim)}
.tside{display:flex;gap:12px;color:var(--dim);font-size:12.5px;align-items:center;padding-top:2px}
.tside span{display:inline-flex;align-items:center;gap:4px}
.tside svg.i{width:15px;height:15px}
.tpill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tpill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.tpill svg.i{width:12px;height:12px}
.t-open{background:var(--warn-soft);color:var(--warn)}
.t-wip{background:rgba(120,160,255,.14);color:#9db8ff}
.t-ok{background:var(--ok-soft);color:var(--ok)}
.t-mentor{background:var(--accent);color:#fff;border-radius:4px;height:20px;letter-spacing:.04em}
.empty-c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:44px 20px;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px}
.empty-c>span svg{width:30px;height:30px;color:var(--dim)}
.empty-c small{color:var(--muted);max-width:40ch}
.empty-c .btn{margin-top:6px}
.rules{list-style:none;margin:10px 0 8px;padding:0;display:flex;flex-direction:column;gap:12px}
.rules li{display:flex;gap:10px;font-size:13.5px;color:var(--muted);line-height:1.45}
.rules li svg{color:var(--accent-hi);margin-top:1px}
.rules b{color:var(--fg);font-weight:600}
.mentor{display:flex;gap:10px;align-items:center;margin-top:12px}
.mentor small{display:block;color:var(--dim);font-size:12px}
.tpost{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.tpost h1{font-size:clamp(22px,2.6vw,28px);font-weight:700;letter-spacing:-.01em;line-height:1.25}
.tbody{font-size:16px;line-height:1.6;color:#e7e0e1;white-space:pre-line}
.rhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px}
.rhead .tav{width:32px;height:32px;font-size:11.5px}
.rhead small{color:var(--dim);font-size:12.5px}
.ract{display:flex;gap:8px;flex-wrap:wrap}
.rbtn{height:32px;padding:0 11px;border-radius:7px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.rbtn svg.i{width:14px;height:14px}
.rbtn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.rbtn.on{color:#fff;background:var(--accent-soft);border-color:rgba(229,34,44,.45)}
.rcount{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.reply{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:9px;background:rgba(255,255,255,.015)}
.reply p{margin:0;font-size:15px;line-height:1.55;color:#e2dbdc;white-space:pre-line}
.reply.m{background:rgba(229,34,44,.06);border-color:rgba(229,34,44,.22)}
.reply.sol{border-color:rgba(63,207,142,.55);background:rgba(63,207,142,.07);margin-top:12px}
.solhead{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ok);letter-spacing:.02em}
.composer{display:flex;gap:12px;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.composer textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:12px;resize:vertical;color:var(--fg);font-size:15px}
.composer textarea:focus{outline:none;border-color:var(--accent-hi)}
.cact{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.cact small{font-size:12px}
.newform{display:flex;flex-direction:column;gap:16px}
.newform .field input,.newform .field select,.newform .field textarea{height:46px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:0 13px;font-size:15px;font-weight:500;color:var(--fg);width:100%}
.newform .field textarea{height:auto;padding:12px 13px;resize:vertical;line-height:1.5}
.newform .field select{appearance:auto}
.newform .field :focus{outline:none;border-color:var(--accent-hi)}

const MON = {raf:null};
function stopMonitor(){ cancelAnimationFrame(MON.raf); MON.raf=null; }
function startMonitor(){
  stopMonitor(); const cv=document.getElementById('mon'); if(!cv) return;
  const ctx=cv.getContext('2d'), dpr=Math.min(2,window.devicePixelRatio||1);
  const rect=cv.getBoundingClientRect(); const W=Math.max(200,Math.round(rect.width)), H=Math.round(rect.height);
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const base=H*.62, amp=H*.5, period=Math.max(150,Math.min(240,W/3.2));
  const g=(x,c,w)=>Math.exp(-((x-c)*(x-c))/(2*w*w));
  const ecg=p=> .10*g(p,.16,.025) - .12*g(p,.30,.008) + 1*g(p,.33,.009) - .28*g(p,.36,.01) + .2*g(p,.58,.045);
  const buf=new Float32Array(W).fill(NaN); const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x=0, gx=0, last=performance.now(), beatShown=-1; const speed=150;
  const yAt=gxv=>base - ecg((gxv%period)/period)*amp;
  if(reduce){ for(let i=0;i<W;i++) buf[i]=yAt(i); }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.lineWidth=2; ctx.lineJoin='round'; ctx.strokeStyle='#ff4a52'; ctx.shadowColor='rgba(255,60,70,.75)'; ctx.shadowBlur=8;
    ctx.beginPath(); let pen=false; const gap=26;
    for(let i=0;i<W;i++){ const v=buf[i]; const ahead=(i-x+W)%W; if(isNaN(v)||(!reduce&&ahead>0&&ahead<gap)){ pen=false; continue; } if(!pen){ ctx.moveTo(i,v); pen=true; } else ctx.lineTo(i,v); }
    ctx.stroke();
    if(!reduce){ ctx.shadowBlur=14; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,buf[x]||base,2.6,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0;
  }
  if(reduce){ draw(); return; }
  function frame(now){
    const dt=Math.min(50,now-last); last=now; let adv=Math.round(speed*dt/1000);
    while(adv-->0){ x=(x+1)%W; gx++; buf[x]=yAt(gx);
      const beat=Math.floor((gx-.33*period)/period); if(beat!==beatShown && ((gx%period)/period)>=.33){ beatShown=beat; const h=document.getElementById('heart'), v=document.getElementById('hrv'); if(h){ h.classList.add('on'); setTimeout(()=>h.classList.remove('on'),140); } if(v) v.textContent=74+Math.round(Math.random()*5); } }
    draw(); MON.raf=requestAnimationFrame(frame);
  }
  MON.raf=requestAnimationFrame(frame);
}

function weekChart(){
  const W=560,H=190,pl=30,pb=26,pt=18, labels=['Ter','Qua','Qui','Sex','Sáb','Dom','Hoje'];
  const max=Math.max(40,Math.ceil(Math.max(...S.week)/20)*20); const bw=(W-pl)/7;
  let g=''; [0,max/2,max].forEach(v=>{ const y=H-pb-(v/max)*(H-pb-pt); g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,236,236,.08)"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${v}</text>`; });
  const bars=S.week.map((m,i)=>{ const h=(m/max)*(H-pb-pt); const x=pl+i*bw+bw*.22, w=bw*.56, y=H-pb-h; const today=i===6;
    return `${m>0?`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${today?'var(--accent-hi)':'rgba(229,34,44,.5)'}"/><text class="vl" x="${x+w/2}" y="${y-6}" text-anchor="middle">${Math.round(m)}</text>`:`<rect x="${x}" y="${H-pb-2}" width="${w}" height="2" rx="1" fill="rgba(255,236,236,.15)"/>`}<text x="${x+w/2}" y="${H-7}" text-anchor="middle" ${today?'style="fill:var(--fg);font-weight:600"':''}>${labels[i]}</text>`; }).join('');
  return `<div class="chart" style="position:relative">${weekTotal()<1?'<p style="position:absolute;inset:0 0 30px 30px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13.5px">Assista sua primeira aula para ver seu ritmo aqui.</p>':''}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos estudados por dia nos últimos 7 dias">${g}${bars}</svg></div>`;
}
function ring(p, ok){ const r=31, cf=2*Math.PI*r; return `<div class="ring"><svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="7"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="${ok?'var(--ok)':'var(--accent)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${cf}" stroke-dashoffset="${cf*(1-p/100)}"/></svg><span class="num">${p}%</span></div>`; }
function kpis(){

function viewLesson(){

const hasQuiz = id => quizOf(id).length>0;
const lqDone = id => !!(S.lq && S.lq[id]);

function quizTab(c,l){

/* trilha de etapas da aula: assistir → quiz → próxima */
function lessonSteps(c,l){

/* modal do quiz */

    <ul class="qm-facts"><li><b class="num">${n}</b><small>perguntas</small></li><li><b>~1</b><small>minuto</small></li><li><b>${I.check}</b><small>correção na hora</small></li></ul>
    <ol class="qm-how"><li><span>1</span>Escolha uma alternativa</li><li><span>2</span>Veja se acertou e o comentário da mentora</li><li><span>3</span>Avance para a próxima pergunta</li></ol>

    ${picked!=null?`<div class="lq-fb ${picked===q.a?'ok':'no'}"><b>${picked===q.a?'Isso mesmo.':'Não foi dessa vez.'}</b> ${esc(q.c||'')}</div>`:`<p class="dim" style="font-size:13px;margin:2px 0 0">Escolha uma alternativa para ver a correção.</p>`}</div>`; }
  const foot = st.phase==='q'? `<div class="qm-foot"><span class="dim num" style="font-size:13px">${Object.keys(st.ans).length} de ${n} respondidas</span><button class="btn btn-white" data-a="lqNext" ${st.ans[st.i]==null?'disabled':''}>${st.i+1<n?'Próxima pergunta':'Ver resultado'} ${I.right}</button></div>` : '';

function stopPlayer(){ clearInterval(P.timer); P.timer=null; P.playing=false; }
function leaveLesson(){

function updVideo(){

/* ---------- AVALIAÇÃO ---------- */
function viewQuiz(){

  const ans=Object.keys(q.answers).length;
  let score='';
  if(q.submitted){ const right=k.quiz.filter((x,i)=>q.answers[i]===x.a).length; const pc=Math.round(right/k.quiz.length*100); const pass=pc>=70;
    score=`<div class="score"><span class="big num" style="color:${pass?'var(--ok)':'var(--accent-hi)'}">${pc}%</span><div style="flex:1;min-width:200px"><strong style="font-size:17px">${pass?'Aprovado! Certificado liberado.':'Quase lá. Revise e tente de novo.'}</strong><p class="muted">${right} de ${k.quiz.length} corretas · mínimo 70% · tentativas ilimitadas</p></div>${pass?`<button class="btn btn-white" data-a="go" data-v="certs" data-cert="${c}">${I.award} Emitir certificado</button>`:`<button class="btn btn-white" data-a="retry">Tentar de novo</button>`}</div>`; }
  return `<div class="wrap"><div class="phead"><button class="back" data-a="course" data-c="${c}">${I.left} ${k.title}</button><span class="eyebrow">Avaliação final</span><h1>${k.title}</h1><p class="muted">4 questões de múltipla escolha. Com 70% ou mais o certificado é liberado. Conteúdo ilustrativo.</p></div>
  <div class="quiz" style="margin-top:16px">${score}
  ${k.quiz.map((x,i)=>`<div class="q"><h3><span class="num">${i+1}.</span>${x.q}</h3>${x.o.map((o,j)=>{ let cls=''; if(q.submitted){ if(j===x.a) cls='right'; else if(q.answers[i]===j) cls='wrong'; } return `<label class="opt ${cls}"><input type="radio" name="q${i}" data-q="${i}" data-o="${j}" ${q.answers[i]===j?'checked':''} ${q.submitted?'disabled':''}>${o}</label>`; }).join('')}</div>`).join('')}
  ${q.submitted?'':`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn btn-red" data-a="submitquiz" ${ans<k.quiz.length?'disabled':''} id="qsub">Enviar respostas</button><span class="dim num" id="qcount">${ans} de ${k.quiz.length} respondidas</span></div>`}
  </div></div>`;
}
