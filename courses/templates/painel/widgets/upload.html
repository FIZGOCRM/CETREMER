{% if widget.is_initial %}<span class="gp-file"><a href="{{ widget.value.url }}">Abrir arquivo atual</a>{% if not widget.required %}<label class="gp-check" for="{{ widget.checkbox_id }}"><input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.attrs.checked %} checked{% endif %}>Remover ao salvar</label>{% endif %}</span>{% endif %}
<span class="gp-dropzone" data-gp-dropzone><span class="gp-dropzone__hint">{% if widget.is_initial %}Escolher outro arquivo{% else %}Escolher arquivo ou arrastar aqui{% endif %}</span><input type="file" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}></span>
